<!DOCTYPE html>
<html ufr>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neoband App</title>
  
  <!-- 
  ============================================================================
  CSS STYLES SECTION
  ============================================================================
  This section contains all the styling for the Neoband App, including:
  - Custom font definitions for the Tomorrow font family
  - Global styles for the body and common elements
  - Navigation menu styling
  - Page layout and visibility controls
  - Form input and button styling
  - Status displays and editable labels
  ============================================================================
  -->
  <style>
    /* Font definitions - Loading custom Tomorrow fonts for the futuristic UI */
    @font-face {
      font-family: 'Tomorrow';
      src: url('app/Tomorrow-Bold.ttf') format('truetype');
      font-weight: bold;
      font-style: normal;
    }
    @font-face {
      font-family: 'Tomorrow';
      src: url('app/Tomorrow-Black.ttf') format('truetype');
      font-weight: 900;
      font-style: normal;
    }
    
    /* Global Styles - Dark cyberpunk theme with cyan accent colors */
    body {
      background-color: #000000; /* Black background for the futuristic look */
      color: #0BDCF3;            /* Cyan text for high contrast and sci-fi feel */
      font-family: 'Tomorrow', sans-serif;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      box-sizing: border-box;
      position: relative;
    }
    
    /* Navigation menu styling - Horizontal menu with cyan border */
    .nav-menu {
      background-color: #000000;
      padding: 15px 0;
      border-bottom: 2px solid #0BDCF3; /* Cyan border for visual separation */
    }
    .nav-menu ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      gap: 30px;
    }
    .nav-menu a {
      color: #0BDCF3;
      text-decoration: none;
      font-size: 16px;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }
    .nav-menu a:hover {
      color: #FFFFFF; /* White on hover for better interaction feedback */
    }
    
    /* Page visibility control - Only show active page */
    .page {
      display: none;
      margin-top: 20px;
    }
    .active {
      display: block;
    }
    
    /* Form elements styling */
    .input {
      font-size: 20px;
      background-color: #FFFFFF;
      color: #000000;
      padding: 5px;
      border: none;
      text-align: center;
      margin-bottom: 10px;
      width: 100%;
      max-width: 300px;
    }
    .read-write-button {
      font-size: 20px;
      background-color: #0BDCF3; /* Cyan buttons */
      color: #000000;            /* Black text for contrast */
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      margin: 10px 5px;
    }
    .read-write-button:hover {
      background-color: #000000; /* Inverted colors on hover */
      color: #0BDCF3;
    }
    .status-display {
      background-color: #FFFFFF;
      color: #000000;
      padding: 5px;
      border: none;
      text-align: center;
      margin-top: 10px;
      width: 100%;
      max-width: 300px;
    }
    
    /* Editable label styling for faction titles and allegiances */
    .editable-label {
      font-size: 18px;
      margin-bottom: 5px;
      padding: 3px 6px;
      border: 1px dashed #0BDCF3; /* Dashed border to indicate editability */
      display: inline-block;
      min-width: 80px;
      cursor: text;
      transition: all 0.3s ease;
      background-color: rgba(11, 220, 243, 0.05);
    }
    
    .editable-label:hover {
      background-color: rgba(11, 220, 243, 0.1);
      border: 1px solid #0BDCF3;
    }
    
    .editable-label:focus {
      outline: none;
      background-color: rgba(11, 220, 243, 0.15);
      border: 1px solid #FFFFFF;
      box-shadow: 0 0 5px rgba(11, 220, 243, 0.5);
    }
    
    /* Allegiance group container */
    .allegiance-group {
      margin-bottom: 15px;
    }
    
    /* Operation Indicator */
    .operation-indicator {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0, 0, 0, 0.9);
      color: #0BDCF3;
      padding: 20px 40px;
      border-radius: 10px;
      border: 2px solid #0BDCF3;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 18px;
      box-shadow: 0 0 20px rgba(11, 220, 243, 0.5);
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      margin: 15px auto;
      border: 4px solid rgba(11, 220, 243, 0.3);
      border-top: 4px solid #0BDCF3;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .operation-status {
      margin-top: 10px;
      font-weight: bold;
    }
    
    /* Log display styling */
    .log-display {
      max-height: 200px;
      overflow: auto;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      margin-top: 15px;
      padding: 10px;
      background-color: #000022;
      border: 1px solid #0BDCF3;
      color: #FFFFFF;
      border-radius: 4px;
    }
    
    /* Scroll bar styling for log displays */
    .log-display::-webkit-scrollbar {
      width: 8px;
    }
    
    .log-display::-webkit-scrollbar-track {
      background: #000033;
    }
    
    .log-display::-webkit-scrollbar-thumb {
      background: #0BDCF3;
      border-radius: 4px;
    }
    
    .log-display::-webkit-scrollbar-thumb:hover {
      background: #07A8BA;
    }
  </style>
</head>
<body>

  <!-- 
  ============================================================================
  NAVIGATION MENU SECTION
  ============================================================================
  This section contains the main navigation menu that allows users to switch
  between the three main pages of the application:
  - Registration Page: For registering new users with their Neoband
  - Factions Page: For managing faction-related data
  - Allegiances Page: For managing allegiance relationships
  ============================================================================
  -->
  <nav class="nav-menu">
    <ul>
      <li><a href="#" onclick="showPage('registrationPage')">Registration</a></li>
      <li><a href="#" onclick="showPage('factionPage')">Factions</a></li>
      <li><a href="#" onclick="showPage('allegiancesPage')">Allegiances</a></li>
    </ul>
  </nav>

  <!-- 
  ============================================================================
  REGISTRATION PAGE
  ============================================================================
  This page handles the initial user registration process for Neobands.
  
  MIFARE 4K MEMORY STRUCTURE:
  - The Mifare 4K has 40 sectors (0-39) with variable block structure:
    - Sectors 0-31: 4 blocks per sector (blocks 0-3)
    - Sectors 32-39: 16 blocks per sector (blocks 0-15)
  - Each block contains exactly 16 bytes of data
  - Block 3 in sectors 0-31 and block 15 in sectors 32-39 are sector trailers
    containing access keys and conditions
  
  NEOBAND MEMORY ALLOCATION:
  - Sector 39 (blocks 0-15) is dedicated to user registration data
  - Username spans across two blocks:
    - Block 0 (address 240): First 16 bytes of username
    - Block 1 (address 241): Second 16 bytes of username
  - This allows for usernames up to 32 characters in length
  
  NFC OPERATIONS:
  - SCAN: Reads the band's unique UID using GetCardIdEx
  - READ: Retrieves the username from blocks 240-241 (Sector 39, Blocks 0-1)
    using LinearRead with Key A (0x60), key index 0
  - WRITE: Writes the username across blocks 240-241 (Sector 39, Blocks 0-1)
    using LinearWrite with Key A (0x60), key index 0
  - RESET: Clears the username data by writing empty values to blocks 240-241
  
  KEY MANAGEMENT:
  - Sector 39 uses authentication key at index 0 (default)
  - Authentication mode is always KEY A (0x60)
  - Block operations always read/write exactly 16 bytes (cannot write partial blocks)
  
  LOGGING FEATURES:
  - Console logs track all NFC operations with timestamps
  - Visual log display shows authentication, read/write operations
  - Detailed error handling with human-readable messages
  ============================================================================
  -->
  <div id="registrationPage" class="page active">
    <h2 contenteditable="true" class="editable-label">User Registration</h2>
    <div>
      <div contenteditable="true" class="editable-label">New Username:</div>
      <input id="usernameInput" class="input" type="text" maxlength="32" placeholder="Enter new username (up to 32 characters)">
    </div>
    <div>
      <div contenteditable="true" class="editable-label">Band ID:</div>
      <input id="bandIdInput" class="input" type="text" readonly placeholder="Waiting for band...">
    </div>
    <div>
      <div contenteditable="true" class="editable-label">Status:</div>
      <input id="statusInput" class="status-display" type="text" readonly placeholder="Unregistered" value="Unregistered">
    </div>
    <div style="margin-top:20px;">
      <button class="read-write-button" onclick="handleScanTag()">SCAN</button>
      <button class="read-write-button" onclick="handleReadRegistration()">READ</button>
      <button class="read-write-button" onclick="handleWriteRegistration()">WRITE</button>
      <button class="read-write-button" onclick="handleResetRegistration()">RESET</button>
    </div>
  </div>

  <!-- 
  ============================================================================
  FACTION PAGE
  ============================================================================
  This page manages faction-related data for a registered user:
  - Displays the username from the scanned band
  - Allows setting Hunter/Bounty status
  - Tracks number of wins
  - Records best draw time
  - Allows editing faction title
  
  NFC Operations (for Alleycat Faction in Sector 1):
  - READ: Primarily uses SectorRead to access Sector 1 directly:
          Username from address 240 (Sector 39, Block 0),
          Hunter/Bounty from Sector 1, Block 0 (address 4),
          Wins from Sector 1, Block 1 (address 5),
          Draw Time from Sector 1, Block 2 (address 6)
          With linear read fallback if sector-based read fails.
  - WRITE: Primarily uses SectorWrite to access Sector 1 directly:
           Hunter/Bounty to Sector 1, Block 0 (address 4),
           Wins to Sector 1, Block 1 (address 5),
           Draw Time to Sector 1, Block 2 (address 6)
           With linear write fallback if sector-based write fails.
  ============================================================================
  -->
  <div id="factionPage" class="page">
    <h2 contenteditable="true" class="editable-label">Factions</h2>
    <div>
      <div contenteditable="true" class="editable-label">Faction Title:</div>
      <div id="factionTitle" class="editable-label" contenteditable="true">ALLEYCAT</div>
    </div>
    <div>
      <div contenteditable="true" class="editable-label">Faction Username:</div>
      <input id="factionUsernameField" class="input" type="text" readonly placeholder="Waiting for scan...">
    </div>
    <div>
      <div contenteditable="true" class="editable-label">Hunter/Bounty:</div>
      <input id="hunterBountyInput" class="input" type="text" placeholder="Enter Hunter/Bounty">
    </div>
    <div>
      <div contenteditable="true" class="editable-label"># of Wins:</div>
      <input id="winsInput" class="input" type="text" placeholder="Enter # of wins">
    </div>
    <div>
      <div contenteditable="true" class="editable-label">Best Draw Time:</div>
      <input id="drawTimeInput" class="input" type="text" placeholder="Enter Best Draw Time">
    </div>
    <div>
      <div contenteditable="true" class="editable-label">Faction Field #1:</div>
      <input id="factionField1" class="input" type="text" placeholder="Faction Field Placeholder">
    </div>
    <div>
      <div contenteditable="true" class="editable-label">Faction Field #2:</div>
      <input id="factionField2" class="input" type="text" placeholder="Faction Field Placeholder">
    </div>
    <div>
      <div contenteditable="true" class="editable-label">Faction Field #3:</div>
      <input id="factionField3" class="input" type="text" placeholder="Faction Field Placeholder">
    </div>
    <div style="margin-top:20px;">
      <button class="read-write-button" onclick="handleScanTag()">SCAN</button>
      <button class="read-write-button" onclick="handleReadFaction()">READ</button>
      <button class="read-write-button" onclick="handleWriteFaction()">WRITE</button>
    </div>
  </div>

  <!-- 
  ============================================================================
  ALLEGIANCES PAGE
  ============================================================================
  This page manages allegiance relationships for a registered user:
  - Displays the username from the scanned band
  - Provides 16 editable allegiance fields
  - Each allegiance has an editable label and input field
  
  NFC Operations:
  - READ: Retrieves allegiance data from address 4 (username) and addresses
          12-32 (16 allegiance fields)
  - WRITE: Writes allegiance data to addresses 4 and 12-32
  
  Note: The 16 allegiance fields are dynamically generated in JavaScript
  ============================================================================
  -->
  <div id="allegiancesPage" class="page">
    <h2 contenteditable="true" class="editable-label">Allegiances</h2>
    <div>
      <div contenteditable="true" class="editable-label">Allegiances Username:</div>
      <input id="allegiancesUsernameField" class="input" type="text" readonly placeholder="Waiting for scan...">
    </div>
    <!-- Container for 16 dynamically generated allegiance fields -->
    <div id="allegiancesContainer">
      <!-- We will create 16 groups dynamically in JavaScript -->
    </div>
    <div style="margin-top:20px;">
      <button class="read-write-button" onclick="handleScanTag()">SCAN</button>
      <button class="read-write-button" onclick="handleReadAllegiances()">READ</button>
      <button class="read-write-button" onclick="handleWriteAllegiances()">WRITE</button>
    </div>
  </div>

  <!-- 
  ============================================================================
  JAVASCRIPT SECTION
  ============================================================================
  This section contains all the JavaScript functionality for the Neoband App,
  organized into logical sections:
  
  1. Utility Functions:
     - Navigation and page management
     - Sleep function for timing operations
     - Text-to-hex and hex-to-text conversion
     - Padding functions for NFC data
  
  2. NFC Communication Functions:
     - Generic read/write functions for NFC operations
     - Address-specific read/write operations
  
  3. Page-Specific Functions:
     - Registration page handlers
     - Faction page handlers
     - Allegiances page handlers
  ============================================================================
  -->
  <script>
    // Global variables
    let tagUID = "";
    let tagIsValid = false;

    /**
     * Initialize the D-Logic NFC reader
     * @returns {Promise<boolean>} - Promise resolving to true if initialization successful
     */
    async function initializeReader() {
      try {
        // Create a promise for reader initialization
        const openPromise = new Promise((resolve) => {
          ufRequest("ReaderOpen", function() {
            const response = ufResponse();
            resolve(response);
          });
        });
        
        const openResponse = await openPromise;
        console.log("Reader initialization response:", openResponse);
        
        if (openResponse.Status === "[0x00 (0)] UFR_OK" || 
            openResponse.Status.includes("ALREADY_OPEN")) {
          console.log("Reader initialized successfully");
          return true;
        } else {
          console.error("Reader initialization failed:", openResponse.Status);
          return false;
        }
      } catch (error) {
        console.error("Error during reader initialization:", error);
        return false;
      }
    }

    /**
     * Helper function to calculate MIFARE sector and block details
     * @param {number} linearAddress - The linear address (0-255)
     * @returns {Object} - Object containing sector, block, and flag info
     */
    function calculateMifareAddress(linearAddress) {
      // Parse input to ensure it's a number
      const address = parseInt(linearAddress, 10);
      if (isNaN(address) || address < 0 || address > 255) {
        throw new Error(`Invalid MIFARE address: ${linearAddress}. Must be between 0-255.`);
      }
      
      let sector, blockInSector, absoluteBlock;
      
      // Calculate sector and block
      if (address < 64) {
        // Small sectors (0-15): 4 blocks per sector
        sector = Math.floor(address / 4);
        blockInSector = address % 4;
        absoluteBlock = address;
      } else {
        // Large sectors (16-39): 16 blocks per sector
        const remainingAddress = address - 64;
        sector = 16 + Math.floor(remainingAddress / 16);
        blockInSector = remainingAddress % 16;
        absoluteBlock = 64 + (sector - 16) * 16 + blockInSector;
      }
      
      // Check if it's a trailer block (contains keys, not data)
      // In small sectors (0-15), block 3 of each sector is a trailer block
      // In large sectors (16-39), block 15 of each sector is a trailer block
      const isTrailerBlock = 
        (sector <= 15 && blockInSector === 3) || 
        (sector > 15 && blockInSector === 15);
      
      // Reserved sectors/blocks in MIFARE 4K
      // Sector 0 Block 0 is manufacturer block (read-only)
      const isManufacturerBlock = (sector === 0 && blockInSector === 0);
      
      return {
        sector,
        blockInSector,
        absoluteBlock,
        isTrailerBlock,
        isManufacturerBlock,
        isReserved: isManufacturerBlock
      };
    }
    
    /**
     * Utility function to convert hex string to text
     */
    function hexToText(hex) {
      let result = "";
      for (let i = 0; i < hex.length; i += 2) {
        const hexCode = hex.substr(i, 2);
        const hexValue = parseInt(hexCode, 16);
        
        // Only convert printable ASCII characters, ignore padding bytes (0xFF)
        if (hexValue >= 32 && hexValue < 127) {
          result += String.fromCharCode(hexValue);
        } else if (hexValue !== 0xFF) {
          // For non-printable characters that aren't padding, add placeholder
          result += ".";
        }
      }
      return result.trim();
    }
    
    /**
     * Utility function to convert text to hex string
     */
    function textToHex(text) {
      let result = "";
      for (let i = 0; i < text.length; i++) {
        const hexCode = text.charCodeAt(i).toString(16).padStart(2, "0");
        result += hexCode;
      }
      return result;
    }
    
    // Function declarations to ensure proper hoisting
    let readField;
    let writeField;
    
    // Reader initialization flag
    let isReaderInitialized = false;
    
    /**
     * Initializes the NFC reader hardware
     * Must be called before any NFC operations
     * @returns {Promise<boolean>} True if initialization was successful
     */
    async function initializeReader() {
      if (isReaderInitialized) {
        return true;
      }
      
      try {
        console.log("[READER] Attempting to initialize NFC reader...");
        
        // Create a promise to handle the asynchronous reader initialization
        return new Promise((resolve) => {
          // Basic ReaderOpen command with no parameters for default reader
          ufRequest("ReaderOpen", function() {
            const response = ufResponse();
            console.log("[READER] Initialization response:", response);
            
            if (response && response.Status === "[0x00 (0)] UFR_OK") {
              console.log("[READER] Successfully initialized NFC reader");
              isReaderInitialized = true;
              resolve(true);
            } else {
              console.error("[READER] Failed to initialize NFC reader:", response ? response.Status : "Unknown error");
              isReaderInitialized = false;
              resolve(false);
            }
          });
        });
      } catch (error) {
        console.error("[READER] Error during initialization:", error);
        isReaderInitialized = false;
        return false;
      }
    }
    
    //==========================================================================
    // UTILITY FUNCTIONS
    //==========================================================================
    
    /**
     * Shows the selected page and hides all others
     * @param {string} pageId - The ID of the page to display
     */
    function showPage(pageId) {
      // Hide all pages
      var pages = document.getElementsByClassName("page");
      for (var i = 0; i < pages.length; i++) {
        pages[i].classList.remove("active");
      }
      // Show the selected page
      document.getElementById(pageId).classList.add("active");
      // If Allegiances page, build fields if not built
      if(pageId === "allegiancesPage") {
        buildAllegiancesFields();
      }
    }

    /**
     * UTILITIES FOR MIFARE MEMORY OPERATIONS
     * ======================================
     */

    /**
     * Displays a temporary visual confirmation message that fades out
     * @param {string} message - The message to display
     * @param {string} type - The type of message ('success', 'error', or 'warning')
     */
    function showVisualConfirmation(message, type = 'success') {
      // Create notification element if it doesn't exist
      let notification = document.getElementById('visualConfirmation');
      if (!notification) {
        notification = document.createElement('div');
        notification.id = 'visualConfirmation';
        notification.style.position = 'fixed';
        notification.style.top = '20%';
        notification.style.left = '50%';
        notification.style.transform = 'translate(-50%, -50%)';
        notification.style.padding = '15px 25px';
        notification.style.borderRadius = '5px';
        notification.style.boxShadow = '0 4px 8px rgba(0,0,0,0.2)';
        notification.style.zIndex = '1000';
        notification.style.fontWeight = 'bold';
        notification.style.fontSize = '18px';
        notification.style.transition = 'opacity 0.5s ease-in-out';
        document.body.appendChild(notification);
      }
      
      // Set styling based on message type
      if (type === 'success') {
        notification.style.backgroundColor = '#0BDCF3';
        notification.style.color = '#000000';
      } else if (type === 'error') {
        notification.style.backgroundColor = '#FF3333';
        notification.style.color = '#FFFFFF';
      } else if (type === 'warning') {
        notification.style.backgroundColor = '#FFA500';
        notification.style.color = '#000000';
      }
      
      // Set message and show notification
      notification.textContent = message;
      notification.style.opacity = '1';
      
      // Hide notification after 3 seconds
      setTimeout(() => {
        notification.style.opacity = '0';
        setTimeout(() => {
          notification.remove();
        }, 500);
      }, 3000);
    }

    /**
     * Helper function to debug MIFARE card memory structure
     * Shows the relationship between linear address and sector/block
     * @param {number} address - Linear address (0-255)
     * @returns {Object} Object containing sector, block, and other details
     */
    function calculateMifareAddress(address) {
      const addressNum = parseInt(address);
      
      // Different calculation for first 32 sectors vs last 8 sectors
      let sectorNum, blockInSector, blockAddress;
      
      if (addressNum < 128) {
        // First 32 sectors (0-31) with 4 blocks each
        sectorNum = Math.floor(addressNum / 4);
        blockInSector = addressNum % 4;
      } else {
        // Last 8 sectors (32-39) with 16 blocks each
        sectorNum = 32 + Math.floor((addressNum - 128) / 16);
        blockInSector = (addressNum - 128) % 16;
      }
      
      // Return detailed information for debugging
      return {
        linearAddress: addressNum,
        sector: sectorNum,
        blockInSector: blockInSector,
        isTrailerBlock: (addressNum < 128 && blockInSector === 3) || 
                        (addressNum >= 128 && blockInSector === 15),
        memoryType: addressNum < 128 ? "First 32 sectors (4 blocks each)" : 
                                      "Last 8 sectors (16 blocks each)"
      };
    }

    /**
     * Converts text to hexadecimal
     * @param {string} text - Text to convert
     * @returns {string} - Hexadecimal string
     */
    function textToHex(text) {
      var hex = "";
      for (var i = 0; i < text.length; i++) {
        var charCode = text.charCodeAt(i).toString(16);
        // Ensure two-digit hex value
        hex += ("0" + charCode).slice(-2);
      }
      return hex;
    }

    /**
     * Converts hexadecimal to text
     * @param {string} hex - Hexadecimal string
     * @returns {string} - Text
     */
    function hexToText(hex) {
      var text = "";
      for (var i = 0; i < hex.length; i += 2) {
        var charCode = parseInt(hex.substr(i, 2), 16);
        // Stop at null or FF padding
        if (charCode === 0 || charCode === 255) break;
        text += String.fromCharCode(charCode);
      }
      return text;
    }

    /**
     * Adds a delay to ensure NFC operations don't overlap
     * 
     * @param {number} ms - Milliseconds to delay
     * @returns {Promise} - Resolves after the specified delay
     * 
     * OPERATION DETAILS:
     * - Creates a promise that resolves after the specified timeout
     * - Used to prevent NFC reader conflicts when operations occur too quickly
     * - Important for sequential read/write operations to complete reliably
     * - Typical use: await sleep(500) between NFC operations
     */
    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    /**
     * Promisified version of ufRequest that uses async/await instead of callbacks
     * @param {string} command - Command to send to the NFC reader
     * @returns {Promise<Object>} - Promise that resolves with the response
     */
    function ufRequestAsync(command) {
      return new Promise((resolve) => {
        ufRequest(command, function() {
          const response = ufResponse();
          resolve(response);
        });
      });
    }

    /**
     * Shows an operation indicator with a spinner while a process is running
     * @param {string} operationName - The name of the operation (e.g., "Scanning", "Reading", etc.)
     * @returns {HTMLElement} - The created indicator element
     */
    function showOperationIndicator(operationName) {
      // Remove any existing indicators
      hideOperationIndicator();
      
      // Create indicator container
      const indicator = document.createElement("div");
      indicator.className = "operation-indicator";
      indicator.id = "operationIndicator";
      
      // Add spinner
      const spinner = document.createElement("div");
      spinner.className = "spinner";
      indicator.appendChild(spinner);
      
      // Add operation text
      const operationText = document.createElement("div");
      operationText.textContent = operationName + "...";

    /**
     * Generic function to read data from an NFC address
     * @param {string} address - The address to read from
     * @returns {Promise<string>} - Promise resolving with the text read
     */
    async function readField(address) {
      // Find any existing log display
      const logDisplay = document.getElementById("registrationLogDisplay") || 
                         document.getElementById("factionLogDisplay") ||
                         document.getElementById("allegiancesLogDisplay");
      
      // Log operation attempt if log display exists
      if (logDisplay) {
        logDisplay.innerHTML += `<div style='color:#FFFFFF;'>Reading from address ${address}...</div>`;
      }
      
      // Ensure reader is initialized
      const readerInitialized = await initializeReader();
      if (!readerInitialized) {
        if (logDisplay) {
          logDisplay.innerHTML += `<div style='color:#FF0000;'>✗ Reader initialization failed</div>`;
        }
        throw "Reader initialization failed";
      }
      
      // Calculate sector details using helper function
      const addrInfo = calculateMifareAddress(address);
      const sectorNum = addrInfo.sector;
      
      // Log detailed memory information for debugging
      console.log(`Memory Structure for address ${address}:`, addrInfo);
      
      if (logDisplay) {
        logDisplay.innerHTML += `<div style='color:#FFFFFF;'>Address ${address} = Sector ${addrInfo.sector}, Block ${addrInfo.blockInSector} ${addrInfo.isTrailerBlock ? '(TRAILER BLOCK)' : ''}</div>`;
        logDisplay.innerHTML += `<div style='color:#FFFFFF;'>Authenticating sector ${sectorNum} with KEY A...</div>`;
      }
      
      // First authenticate the sector - using explicit promise-based approach
      const authPromise = new Promise((resolve) => {
        ufRequest(`BlockAuthenticate ${sectorNum} 0x60 0`, function() {
          const response = ufResponse();
          resolve(response);
        });
      });
      
      const authResponse = await authPromise;
      
      if (authResponse.Status !== "[0x00 (0)] UFR_OK") {
        console.error(`Authentication error for sector ${sectorNum}: ${authResponse.Status}`);
        if (logDisplay) {
          logDisplay.innerHTML += `<div style='color:#FF0000;'>✗ Authentication failed for sector ${sectorNum}: ${authResponse.Status}</div>`;
          // Add detailed error information for debugging
          logDisplay.innerHTML += `<div style='color:#FFA500;'>⚠ Check if KEY A (0x60) is correct for sector ${sectorNum}</div>`;
        }
        throw `Authentication failed: ${authResponse.Status}`;
      }
      
      if (logDisplay) {
        logDisplay.innerHTML += `<div style='color:#00FF00;'>✓ Successfully authenticated sector ${sectorNum}</div>`;
      }
      
      // After successful authentication, perform the read - using explicit promise-based approach
      const readPromise = new Promise((resolve) => {
        ufRequest(`LinearRead h ${address} 16 0x60 0`, function() {
          const response = ufResponse();
          resolve(response);
        });
      });
      
      const output = await readPromise;
      
      if (output.Status === "[0x00 (0)] UFR_OK") {
        let data = output.Data;
        if (data.startsWith("0x")) {
          data = data.substring(2);
        }
        const text = hexToText(data);
        console.log("Read from address " + address + ": " + text);
        
        if (logDisplay) {
          logDisplay.innerHTML += `<div style='color:#00FF00;'>✓ Successfully read from address ${address}: "${text}" (0x${data})</div>`;
          logDisplay.scrollTop = logDisplay.scrollHeight;
        }
        
        return text;
      } else {
        console.error("Read error at address " + address + ": " + output.Status);
        
        if (logDisplay) {
          logDisplay.innerHTML += `<div style='color:#FF0000;'>✗ Error reading address ${address}: ${output.Status}</div>`;
          
          // Special handling for common errors
          if (output.Status.includes("AUTH_ERROR")) {
            logDisplay.innerHTML += `<div style='color:#FFA500;'>⚠ Authentication error! This might be due to:</div>`;
            logDisplay.innerHTML += `<div style='color:#FFA500;'>  - Wrong key used (currently using KEY A)</div>`;
            logDisplay.innerHTML += `<div style='color:#FFA500;'>  - Key index is incorrect (currently using index 0)</div>`;
            logDisplay.innerHTML += `<div style='color:#FFA500;'>  - Block is protected with different access rights</div>`;
          }
          logDisplay.scrollTop = logDisplay.scrollHeight;
        }
        
        throw "Read failed: " + output.Status;
      }
    }

    /**
     * Generic function to write data to an NFC address
     * @param {string} address - The address to write to
     * @param {string} text - The text to write
     * @returns {Promise<void>} - Promise resolving when write is complete
     */
    async function writeField(address, text) {
      let hexData = textToHex(text);
      // Pad to 32 chars (16 bytes) with FF
      while (hexData.length < 32) {
        hexData += "FF";
      }
      
      // Find any existing log display
      const logDisplay = document.getElementById("registrationLogDisplay") || 
                         document.getElementById("factionLogDisplay") ||
                         document.getElementById("allegiancesLogDisplay");
      
      // Log operation attempt if log display exists
      if (logDisplay) {
        logDisplay.innerHTML += `<div style='color:#FFFFFF;'>Writing to address ${address}: "${text}" (0x${hexData})...</div>`;
      }
      
      // Ensure reader is initialized
      const readerInitialized = await initializeReader();
      if (!readerInitialized) {
        if (logDisplay) {
          logDisplay.innerHTML += `<div style='color:#FF0000;'>✗ Reader initialization failed</div>`;
        }
        throw "Reader initialization failed";
      }
      
      // Calculate sector details using helper function
      const addrInfo = calculateMifareAddress(address);
      const sectorNum = addrInfo.sector;
      
      // Log detailed memory information for debugging
      console.log(`Memory Structure for address ${address}:`, addrInfo);
      
      if (logDisplay) {
        logDisplay.innerHTML += `<div style='color:#FFFFFF;'>Address ${address} = Sector ${addrInfo.sector}, Block ${addrInfo.blockInSector} ${addrInfo.isTrailerBlock ? '(TRAILER BLOCK)' : ''}</div>`;
        
        // Warn if attempting to write to a trailer block
        if (addrInfo.isTrailerBlock) {
          logDisplay.innerHTML += `<div style='color:#FF0000;'>⚠ WARNING: Writing to a sector trailer block (${address})! This contains access keys and may cause permanent damage if written incorrectly.</div>`;
        }
        
        logDisplay.innerHTML += `<div style='color:#FFFFFF;'>Authenticating sector ${sectorNum} with KEY A...</div>`;
      }
      
      // First authenticate the sector - using explicit promise-based approach
      const authPromise = new Promise((resolve) => {
        ufRequest(`BlockAuthenticate ${sectorNum} 0x60 0`, function() {
          const response = ufResponse();
          resolve(response);
        });
      });
      
      const authResponse = await authPromise;
      
      if (authResponse.Status !== "[0x00 (0)] UFR_OK") {
        console.error(`Authentication error for sector ${sectorNum}: ${authResponse.Status}`);
        if (logDisplay) {
          logDisplay.innerHTML += `<div style='color:#FF0000;'>✗ Authentication failed for sector ${sectorNum}: ${authResponse.Status}</div>`;
          // Add detailed error information for debugging
          logDisplay.innerHTML += `<div style='color:#FFA500;'>⚠ Check if KEY A (0x60) is correct for sector ${sectorNum}</div>`;
        }
        throw `Authentication failed: ${authResponse.Status}`;
      }
      
      if (logDisplay) {
        logDisplay.innerHTML += `<div style='color:#00FF00;'>✓ Successfully authenticated sector ${sectorNum}</div>`;
      }
      
      // After successful authentication, perform the write - using explicit promise-based approach
      const writePromise = new Promise((resolve) => {
        ufRequest(`LinearWrite 0x${hexData} ${address} 16 0x60 0`, function() {
          const response = ufResponse();
          resolve(response);
        });
      });
      
      const output = await writePromise;
      
      if (output.Status === "[0x00 (0)] UFR_OK") {
        console.log("Write successful to address " + address + ": " + text);
        
        if (logDisplay) {
          logDisplay.innerHTML += `<div style='color:#00FF00;'>✓ Successfully wrote to address ${address}: "${text}"</div>`;
          logDisplay.scrollTop = logDisplay.scrollHeight;
        }
      } else {
        console.error("Write error at address " + address + ": " + output.Status);
        
        if (logDisplay) {
          logDisplay.innerHTML += `<div style='color:#FF0000;'>✗ Error writing to address ${address}: ${output.Status}</div>`;
          
          // Special handling for common errors
          if (output.Status.includes("AUTH_ERROR")) {
            logDisplay.innerHTML += `<div style='color:#FFA500;'>⚠ Authentication error! This might be due to:</div>`;
            logDisplay.innerHTML += `<div style='color:#FFA500;'>  - Wrong key used (currently using KEY A)</div>`;
            logDisplay.innerHTML += `<div style='color:#FFA500;'>  - Key index is incorrect (currently using index 0)</div>`;
            logDisplay.innerHTML += `<div style='color:#FFA500;'>  - Block is protected with different access rights</div>`;
          }
          logDisplay.scrollTop = logDisplay.scrollHeight;
        }
        
        throw "Write failed: " + output.Status;
      }
    }

    /**
     * MIFARE MEMORY LAYOUT DOCUMENTATION
     * ==================================
     * 
     * MIFARE CLASSIC 4K STRUCTURE:
     * - Total Memory: 4096 bytes (4K)
     * - Block Size: 16 bytes per block
     * - Total Blocks: 256 blocks (numbered 0-255)
     * - Sector Organization:
     *   - Sectors 0-31: 4 blocks per sector (Blocks 0-127) 
     *   - Sectors 32-39: 16 blocks per sector (Blocks 128-255)
     * 
     * ADDRESSING SCHEMES:
     * - Linear Addressing: Block numbers 0-255 used in most functions
     * - Sector/Block Addressing: (Sector X, Block Y) - Used for reference
     *   - Conversion: Linear Block = (Sector * 4) + Block (for sectors 0-31)
     *   - For sectors 32-39: Linear Block = 128 + ((Sector-32) * 16) + Block
     * 
     * NEOBAND MEMORY ALLOCATION:
     * - Registration Data (Username): Sector 39, Blocks 0-1 (Linear Blocks 240-241)
     *   - Block 240: First 16 chars of username
     *   - Block 241: Last 16 chars of username
     * 
     * AUTHENTICATION:
     * - All operations use KEY A authentication (0x60)
     * - Key Index 0 is used for all read/write operations
     * - Standard MIFARE access conditions applied
     * 
     * BLOCK FORMAT:
     * - Each block stores exactly 16 bytes
     * - Unused space is padded with 0xFF
     * - String data is ASCII/UTF-8 encoded
     * - No special header/footer is used
     * 
     * DATA HANDLING:
     * - Username limited to 32 characters (spans 2 blocks)
     * - Data is read/written as raw strings
     * - Empty fields are written as empty strings (filled with 0xFF padding)
     */

    /**

     */
    async function handleScanTag() {
      showOperationIndicator("Initializing Reader");
      
      try {
        // Get log display element
        const logDisplay = document.getElementById("registrationLogDisplay") || 
                          document.getElementById("factionLogDisplay") ||
                          document.getElementById("allegiancesLogDisplay");
        
        if (logDisplay) {
          logDisplay.innerHTML = ""; // Clear the log
          logDisplay.innerHTML += `<div style='color:#FFFFFF;'>Initializing NFC reader...</div>`;
        }
        
        // Initialize reader
        const readerInitialized = await initializeReader();
        if (!readerInitialized) {
          updateOperationIndicator("Reader initialization failed");
          if (logDisplay) {
            logDisplay.innerHTML += `<div style='color:#FF0000;'>✗ Reader initialization failed. Please ensure reader is connected and working.</div>`;
          }
          setTimeout(() => {
            hideOperationIndicator();
            showVisualConfirmation("Reader initialization failed", "Please ensure the reader is connected and drivers are installed.", "error");
          }, 1000);
          return;
        }
        
        // Reader successfully initialized
        if (logDisplay) {
          logDisplay.innerHTML += `<div style='color:#00FF00;'>✓ Reader initialized successfully</div>`;
        }
        
        updateOperationIndicator("Scanning for card...");
        if (logDisplay) {
          logDisplay.innerHTML += `<div style='color:#FFFFFF;'>Waiting for tag...</div>`;
        }
        
        // Get card ID using promise approach
        const getCardIdPromise = new Promise((resolve) => {
          ufRequest("GetCardIdEx", function() {
            const response = ufResponse();
            resolve(response);
          });
        });
        
        const response = await getCardIdPromise;
        
        // Update the UI based on the result
        if (response.Status === "[0x00 (0)] UFR_OK") {
          tagUID = response.CardId;
          tagIsValid = true;
          
          updateOperationIndicator("NFC Tag Detected");
          
          if (logDisplay) {
            logDisplay.innerHTML += `<div style='color:#00FF00;'>✓ Tag detected with UID: ${tagUID}</div>`;
          }
          
          // Populate UID across all possible pages
          const uidElements = document.getElementsByClassName("uidvalue");
          for (let i = 0; i < uidElements.length; i++) {
            uidElements[i].innerHTML = tagUID;
          }
          
          // Show success confirmation
          setTimeout(() => {
            hideOperationIndicator();
            showVisualConfirmation("Tag Successfully Scanned", `UID: ${tagUID}`, "success");
          }, 1000);
          
          return tagUID;
        } else {
          tagUID = "";
          tagIsValid = false;
          
          updateOperationIndicator("No NFC Tag Detected");
          
          if (logDisplay) {
            logDisplay.innerHTML += `<div style='color:#FF0000;'>✗ Failed to detect tag: ${response.Status}</div>`;
            
            // Add helpful debugging info for common issues
            if (response.Status.includes("NO_CARD")) {
              logDisplay.innerHTML += `<div style='color:#FFA500;'>⚠ No card on reader. Please place a compatible MIFARE card on the reader.</div>`;
            } else if (response.Status.includes("TIMEOUT")) {
              logDisplay.innerHTML += `<div style='color:#FFA500;'>⚠ Reader timeout. Please ensure the card is positioned correctly.</div>`;
            } else if (response.Status.includes("PORT_ERROR")) {
              logDisplay.innerHTML += `<div style='color:#FFA500;'>⚠ Reader connection issue. Try disconnecting and reconnecting the reader.</div>`;
            }
          }
          
          // Clear UID across all possible pages
          const uidElements = document.getElementsByClassName("uidvalue");
          for (let i = 0; i < uidElements.length; i++) {
            uidElements[i].innerHTML = "NO BAND SCANNED";
          }
          
          // Show error confirmation
          setTimeout(() => {
            hideOperationIndicator();
            showVisualConfirmation("Tag Scan Failed", response.Status, "error");
          }, 1000);
          
          return null;
        }
      } catch (error) {
        console.error("Error in handleScanTag:", error);
        updateOperationIndicator("Error scanning tag");
        
        const logDisplay = document.getElementById("registrationLogDisplay") || 
                          document.getElementById("factionLogDisplay") ||
                          document.getElementById("allegiancesLogDisplay");
        
        if (logDisplay) {
          logDisplay.innerHTML += `<div style='color:#FF0000;'>✗ Error scanning tag: ${error}</div>`;
        }
        
        // Show error confirmation
        setTimeout(() => {
          hideOperationIndicator();
          showVisualConfirmation("Tag Scan Error", error.toString(), "error");
        }, 1000);
        
        return null;
      }
    }

    /**
     * Creates or gets a log display for the current page
     * @param {string} pageId - The ID of the page containing the log
     * @param {string} logType - The type of log (e.g., 'registration', 'faction', 'allegiances')
     * @param {string} headerText - The header text to display at the top of the log
     * @returns {HTMLElement} - The log display element
     */
    function createLogDisplay(pageId, logType, headerText) {
      // Determine log ID based on type
      const logId = `${logType}LogDisplay`;
      
      // Check if log display already exists
      let logDisplay = document.getElementById(logId);
      
      // Create log display if it doesn't exist
      if (!logDisplay) {
        logDisplay = document.createElement("div");
        logDisplay.id = logId;
        logDisplay.className = "log-display";
        
        // Find the container to append the log display to
        const container = document.getElementById(pageId);
        if (container) {
          container.appendChild(logDisplay);
        } else {
          console.error(`Container with ID ${pageId} not found`);
        }
      }
      
      // Clear and initialize the log display with header
      if (headerText) {
        logDisplay.innerHTML = `<div style='color:#0BDCF3;'>--- ${headerText} ---</div>`;
      } else {
        logDisplay.innerHTML = "";
      }
      
      return logDisplay;
    }

    /**
     * Dynamically builds the 16 allegiance fields
     */
    function buildAllegiancesFields() {
      const container = document.getElementById("allegiancesContainer");
      // Only build if not already built
      if (container.childElementCount > 0) return;
      
      // Create 16 allegiance field groups
      for (let i = 1; i <= 16; i++) {
        // Create a group div
        const group = document.createElement("div");
        group.className = "allegiance-group";
        
        // Create an editable label
        const label = document.createElement("div");
        label.className = "editable-label";
        label.contentEditable = "true";
        label.id = "allegianceLabel" + i;
        
        // Set default label text based on known allegiance names
        if (i <= 8) {
          label.innerText = "ENDLINE " + i;
        } else if (i <= 12) {
          label.innerText = "HELIX " + (i-8);
        } else {
          label.innerText = "RESISTANCE " + (i-12);
        }
        
        // Create an input field
        const input = document.createElement("input");
        input.type = "text";
        input.className = "input";
        input.placeholder = "Enter value";
        input.id = "allegiance" + i;
        
        // Append label and input to the group
        group.appendChild(label);
        group.appendChild(document.createElement("br"));
        group.appendChild(input);
        
        // Append the group to the container
        container.appendChild(group);
      }
    }
    
    /**
     * Reads allegiance data from the NFC band
     */
    async function handleReadAllegiances() {
      showOperationIndicator("Reading Allegiance Data");

      // Create log display for allegiances page
      const logDisplay = createLogDisplay("allegiancesPage", "allegiances", "READ ALLEGIANCE DATA");

            hideOperationIndicator();

        // First read the username to populate that field

          document.getElementById("allegiancesUsernameField").value = username;

          setTimeout(() => {

          setTimeout(() => {

            showVisualConfirmation("Partial Read Complete", `${successCount} of 16 allegiance fields read successfully`, "warning");

        } else {
          updateOperationIndicator("Failed to Read Allegiance Data");
          
          setTimeout(() => {
            hideOperationIndicator();
            showVisualConfirmation("Read Failed", "Failed to read any allegiance data", "error");
          }, 1000);

          hideOperationIndicator();
          showVisualConfirmation("Error Reading Allegiance Data", error.toString(), "error");
        }, 1000);
      }
