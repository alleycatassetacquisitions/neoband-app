<!DOCTYPE html>
<html ufr>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neoband App Inline – Complete Version</title>
  <style>
    /* Font definitions */
    @font-face {
      font-family: 'Tomorrow';
      src: url('app/Tomorrow-Bold.ttf') format('truetype');
      font-weight: bold;
      font-style: normal;
    }
    @font-face {
      font-family: 'Tomorrow';
      src: url('app/Tomorrow-Black.ttf') format('truetype');
      font-weight: 900;
      font-style: normal;
    }
    /* Global Styles */
    body {
      background-color: #000000;
      color: #0BDCF3;
      font-family: 'Tomorrow', sans-serif;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      box-sizing: border-box;
      position: relative;
    }
    .nav-menu {
      background-color: #000000;
      padding: 15px 0;
      border-bottom: 2px solid #0BDCF3;
    }
    .nav-menu ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      gap: 30px;
    }
    .nav-menu a {
      color: #0BDCF3;
      text-decoration: none;
      font-size: 16px;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }
    .nav-menu a:hover {
      color: #FFFFFF;
    }
    .page {
      display: none;
      margin-top: 20px;
    }
    .active {
      display: block;
    }
    .input {
      font-size: 20px;
      background-color: #FFFFFF;
      color: #000000;
      padding: 5px;
      border: none;
      text-align: center;
      margin-bottom: 10px;
      width: 100%;
      max-width: 300px;
    }
    .read-write-button {
      font-size: 20px;
      background-color: #0BDCF3;
      color: #000000;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      margin: 10px 5px;
    }
    .read-write-button:hover {
      background-color: #000000;
      color: #0BDCF3;
    }
    .status-display {
      background-color: #FFFFFF;
      color: #000000;
      padding: 5px;
      border: none;
      text-align: center;
      margin-top: 10px;
      width: 100%;
      max-width: 300px;
    }
    .editable-label {
      font-size: 18px;
      margin-bottom: 5px;
      padding: 3px;
      border: 1px dashed #0BDCF3;
      display: inline-block;
      min-width: 80px;
      cursor: text;
    }
    .allegiance-group {
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <!-- Navigation Menu -->
  <nav class="nav-menu">
    <ul>
      <li><a href="#" onclick="showPage('registrationPage')">Registration</a></li>
      <li><a href="#" onclick="showPage('factionPage')">Factions</a></li>
      <li><a href="#" onclick="showPage('allegiancesPage')">Allegiances</a></li>
    </ul>
  </nav>

  <!-- Registration Page -->
  <div id="registrationPage" class="page active">
    <h2>User Registration</h2>
    <div>
      <label>New Username:</label><br>
      <input id="usernameInput" class="input" type="text" maxlength="7" placeholder="Enter new username">
    </div>
    <div>
      <label>Band ID:</label><br>
      <input id="bandIdInput" class="input" type="text" readonly placeholder="Waiting for band...">
    </div>
    <div>
      <label>Status:</label><br>
      <input id="statusInput" class="status-display" type="text" readonly placeholder="Unregistered" value="Unregistered">
    </div>
    <div style="margin-top:20px;">
      <button class="read-write-button" onclick="handleScanTag()">SCAN</button>
      <button class="read-write-button" onclick="handleReadRegistration()">READ</button>
      <button class="read-write-button" onclick="handleWriteRegistration()">WRITE</button>
      <button class="read-write-button" onclick="handleResetRegistration()">RESET</button>
    </div>
  </div>

  <!-- Faction Page -->
  <div id="factionPage" class="page">
    <h2>Factions</h2>
    <div>
      <label>Faction Username:</label><br>
      <input id="factionUsernameField" class="input" type="text" readonly placeholder="Waiting for scan...">
    </div>
    <div>
      <label>Hunter/Bounty:</label><br>
      <input id="hunterBountyInput" class="input" type="text" placeholder="Enter Hunter/Bounty">
    </div>
    <div>
      <label># of Wins:</label><br>
      <input id="winsInput" class="input" type="text" placeholder="Enter # of wins">
    </div>
    <div>
      <label>Best Draw Time:</label><br>
      <input id="drawTimeInput" class="input" type="text" placeholder="Enter Best Draw Time">
    </div>
    <div>
      <label>Faction Title:</label><br>
      <div id="factionTitle" class="editable-label" contenteditable="true">ALLEYCAT</div>
    </div>
    <div style="margin-top:20px;">
      <button class="read-write-button" onclick="handleReadFaction()">READ</button>
      <button class="read-write-button" onclick="handleWriteFaction()">WRITE</button>
    </div>
  </div>

  <!-- Allegiances Page -->
  <div id="allegiancesPage" class="page">
    <h2>Allegiances</h2>
    <div>
      <label>Allegiances Username:</label><br>
      <input id="allegiancesUsernameField" class="input" type="text" readonly placeholder="Waiting for scan...">
    </div>
    <!-- 16 Allegiance Fields -->
    <div id="allegiancesContainer">
      <!-- We will create 16 groups dynamically in JavaScript -->
    </div>
    <div style="margin-top:20px;">
      <button class="read-write-button" onclick="handleReadAllegiances()">READ</button>
      <button class="read-write-button" onclick="handleWriteAllegiances()">WRITE</button>
    </div>
  </div>

  <!-- Inline JavaScript for NFC Operations and Page Management -->
  <script>
    // Navigation helper.
    function showPage(pageId) {
      var pages = document.getElementsByClassName("page");
      for (var i = 0; i < pages.length; i++) {
        pages[i].classList.remove("active");
      }
      document.getElementById(pageId).classList.add("active");
      // If Allegiances page, build fields if not built.
      if(pageId === "allegiancesPage") {
        buildAllegiancesFields();
      }
    }

    // Sleep function.
    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // Convert text to hex.
    function textToHex(text) {
      var hex = "";
      for (var i = 0; i < text.length; i++) {
        hex += text.charCodeAt(i).toString(16).padStart(2, '0');
      }
      return hex;
    }

    // Pad hex string to totalLength with "FF".
    function padHex(hexStr, totalLength) {
      while (hexStr.length < totalLength) {
        hexStr += "FF";
      }
      return hexStr;
    }

    // Convert hex string to text; trim trailing "FF" padding.
    function hexToText(hexStr) {
      hexStr = hexStr.replace(/(FF)+$/i, "");
      var text = "";
      for (var i = 0; i < hexStr.length; i += 2) {
        text += String.fromCharCode(parseInt(hexStr.substr(i, 2), 16));
      }
      return text;
    }

    // Generic function to perform a linear write at a given address.
    async function writeField(address, text) {
      var hexData = textToHex(text);
      // Pad or truncate hexData to exactly 32 hex characters (16 bytes).
      if(hexData.length > 32) {
        hexData = hexData.substr(0, 32);
      } else {
        hexData = padHex(hexData, 32);
      }
      var auth_mode = " 0x60";
      var key_index = 0;
      var command = "LinearWrite 0x" + hexData + " " + address + " 16" + auth_mode + " " + key_index;
      await sleep(500);
      return new Promise(function(resolve, reject) {
        ufRequest(command, function() {
          var output = ufResponse();
          if (output.Status === "[0x00 (0)] UFR_OK") {
            resolve();
          } else {
            reject("Write failed at address " + address + ": " + output.Status);
          }
        });
      });
    }

    // Generic function to perform a linear read from a given address.
    async function readField(address) {
      var auth_mode = " 0x60";
      var key_index = 0;
      var command = "LinearRead h " + address + " 16" + auth_mode + " " + key_index;
      await sleep(500);
      return new Promise(function(resolve, reject) {
        ufRequest(command, function() {
          var output = ufResponse();
          if (output.Status === "[0x00 (0)] UFR_OK") {
            var rawHex = output.Data;
            if(rawHex.startsWith("0x") || rawHex.startsWith("0X")) {
              rawHex = rawHex.slice(2);
            }
            resolve(hexToText(rawHex));
          } else {
            reject("Read failed at address " + address + ": " + output.Status);
          }
        });
      });
    }

    // Registration Page functions.
    async function handleScanTag() {
      try {
        ufRequest("GetCardIdEx", function() {
          var output = ufResponse();
          if (output && output.Status === "[0x00 (0)] UFR_OK") {
            var uid = output.CardUid || "Unknown UID";
            document.getElementById("bandIdInput").value = uid;
            document.getElementById("statusInput").value = "Connected";
            // Update username fields on Faction and Allegiances pages.
            document.getElementById("factionUsernameField").value = uid;
            document.getElementById("allegiancesUsernameField").value = uid;
          } else {
            alert("Failed to scan tag. Status: " + (output ? output.Status : "Unknown"));
            document.getElementById("statusInput").value = "Error";
          }
        });
      } catch (error) {
        alert("Error scanning tag: " + error.message);
      }
    }

    async function handleReadRegistration() {
      try {
        // Read username from address 4.
        var username = await readField("4");
        document.getElementById("usernameInput").value = username;
        document.getElementById("statusInput").value = "Read OK";
      } catch (error) {
        document.getElementById("statusInput").value = "Read Error";
        alert(error);
      }
    }

    async function handleWriteRegistration() {
      try {
        var username = document.getElementById("usernameInput").value.trim();
        if (!document.getElementById("bandIdInput").value.trim()) {
          alert("Please scan a band first.");
          return;
        }
        if (!username) {
          alert("Please enter a username.");
          return;
        }
        if (username.length > 7) {
          alert("Username must be 7 characters or less.");
          return;
        }
        await writeField("4", username);
        document.getElementById("statusInput").value = "Registered";
        alert("Registration successful!");
      } catch (error) {
        document.getElementById("statusInput").value = "Write Error";
        alert(error);
      }
    }

    async function handleResetRegistration() {
      try {
        if (!document.getElementById("bandIdInput").value.trim()) {
          alert("Please scan a band first.");
          return;
        }
        if (!confirm("Are you sure you want to reset this band? This will erase the username.")) {
          return;
        }
        await writeField("4", "");
        document.getElementById("usernameInput").value = "";
        document.getElementById("bandIdInput").value = "Waiting for band...";
        document.getElementById("statusInput").value = "Unregistered";
        alert("Reset successful!");
      } catch (error) {
        alert(error);
      }
    }

    // Faction Page functions.
    async function handleReadFaction() {
      try {
        // Faction username (from registration address 4)
        var factionUser = await readField("4");
        document.getElementById("factionUsernameField").value = factionUser;
        // Hunter/Bounty at address 8.
        var hunterBounty = await readField("8");
        document.getElementById("hunterBountyInput").value = hunterBounty;
        // Wins at address 9.
        var wins = await readField("9");
        document.getElementById("winsInput").value = wins;
        // Draw Time at address 10.
        var drawTime = await readField("10");
        document.getElementById("drawTimeInput").value = drawTime;
      } catch (error) {
        alert("Faction read error: " + error);
      }
    }

    async function handleWriteFaction() {
      try {
        // For faction page, we write only the fields that are editable:
        // Hunter/Bounty to address 8.
        await writeField("8", document.getElementById("hunterBountyInput").value.trim());
        // Wins to address 9.
        await writeField("9", document.getElementById("winsInput").value.trim());
        // Draw Time to address 10.
        await writeField("10", document.getElementById("drawTimeInput").value.trim());
        alert("Faction data written successfully!");
      } catch (error) {
        alert("Faction write error: " + error);
      }
    }

    // Allegiances Page functions.
    // Build the 16 editable allegiance fields dynamically.
    function buildAllegiancesFields() {
      var container = document.getElementById("allegiancesContainer");
      if (container.childElementCount > 0) return; // Already built.
      for (var i = 1; i <= 16; i++) {
        // Create a group div.
        var group = document.createElement("div");
        group.className = "allegiance-group";
        // Create an editable label.
        var label = document.createElement("div");
        label.className = "editable-label";
        label.contentEditable = "true";
        label.innerText = "TEXT " + i;
        // Create an input field.
        var input = document.createElement("input");
        input.type = "text";
        input.className = "input";
        input.placeholder = "Enter text";
        // Set an ID for the input.
        input.id = "allegiance" + i;
        // Append label and input to the group.
        group.appendChild(label);
        group.appendChild(document.createElement("br"));
        group.appendChild(input);
        // Append the group to the container.
        container.appendChild(group);
      }
    }

    // Mapping of allegiance fields to their preassigned addresses.
    const allegianceAddresses = {
      1: "12", 2: "13", 3: "14", 4: "16",
      5: "17", 6: "18", 7: "20", 8: "21",
      9: "22", 10: "24", 11: "25", 12: "26",
      13: "28", 14: "29", 15: "30", 16: "32"
    };

    async function handleReadAllegiances() {
      try {
        // Update the Allegiances Username (from address 4).
        var allegUser = await readField("4");
        document.getElementById("allegiancesUsernameField").value = allegUser;
        // Loop through each allegiance field.
        for (var i = 1; i <= 16; i++) {
          var address = allegianceAddresses[i];
          var text = await readField(address);
          document.getElementById("allegiance" + i).value = text;
        }
      } catch (error) {
        alert("Allegiances read error: " + error);
      }
    }

    async function handleWriteAllegiances() {
      try {
        // Write Allegiances Username (if needed, from address 4).
        // Here we assume it's the same as the registration username.
        var regUser = document.getElementById("usernameInput").value.trim();
        if(regUser) {
          await writeField("4", regUser);
          document.getElementById("allegiancesUsernameField").value = regUser;
        }
        // Loop through each allegiance field.
        for (var i = 1; i <= 16; i++) {
          var address = allegianceAddresses[i];
          var text = document.getElementById("allegiance" + i).value.trim();
          await writeField(address, text);
        }
        alert("Allegiances data written successfully!");
      } catch (error) {
        alert("Allegiances write error: " + error);
      }
    }
  </script>

</body>
</html>
