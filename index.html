<!DOCTYPE html>
<html ufr>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neoband App</title>
  
  <!-- 
  ============================================================================
  CSS STYLES SECTION
  ============================================================================
  This section contains all the styling for the Neoband App, including:
  - Custom font definitions for the Tomorrow font family
  - Global styles for the body and common elements
  - Navigation menu styling
  - Page layout and visibility controls
  - Form input and button styling
  - Status displays and editable labels
  ============================================================================
  -->
  <style>
    /* Font definitions - Loading custom Tomorrow fonts for the futuristic UI */
    @font-face {
      font-family: 'Tomorrow';
      src: url('app/Tomorrow-Bold.ttf') format('truetype');
      font-weight: bold;
      font-style: normal;
    }
    @font-face {
      font-family: 'Tomorrow';
      src: url('app/Tomorrow-Black.ttf') format('truetype');
      font-weight: 900;
      font-style: normal;
    }
    
    /* Global Styles - Dark cyberpunk theme with cyan accent colors */
    body {
      background-color: #000000; /* Black background for the futuristic look */
      color: #0BDCF3;            /* Cyan text for high contrast and sci-fi feel */
      font-family: 'Tomorrow', sans-serif;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      box-sizing: border-box;
      position: relative;
    }
    
    /* Navigation menu styling - Horizontal menu with cyan border */
    .nav-menu {
      background-color: #000000;
      padding: 15px 0;
      border-bottom: 2px solid #0BDCF3; /* Cyan border for visual separation */
    }
    .nav-menu ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      gap: 30px;
    }
    .nav-menu a {
      color: #0BDCF3;
      text-decoration: none;
      font-size: 16px;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }
    .nav-menu a:hover {
      color: #FFFFFF; /* White on hover for better interaction feedback */
    }
    
    /* Page visibility control - Only show active page */
    .page {
      display: none;
      margin-top: 20px;
    }
    .active {
      display: block;
    }
    
    /* Form elements styling */
    .input {
      font-size: 20px;
      background-color: #FFFFFF;
      color: #000000;
      padding: 5px;
      border: none;
      text-align: center;
      margin-bottom: 10px;
      width: 100%;
      max-width: 300px;
    }
    .read-write-button {
      font-size: 20px;
      background-color: #0BDCF3; /* Cyan buttons */
      color: #000000;            /* Black text for contrast */
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      margin: 10px 5px;
    }
    .read-write-button:hover {
      background-color: #000000; /* Inverted colors on hover */
      color: #0BDCF3;
    }
    .status-display {
      background-color: #FFFFFF;
      color: #000000;
      padding: 5px;
      border: none;
      text-align: center;
      margin-top: 10px;
      width: 100%;
      max-width: 300px;
    }
    
    /* Editable label styling for faction titles and allegiances */
    .editable-label {
      font-size: 18px;
      margin-bottom: 5px;
      padding: 3px;
      border: 1px dashed #0BDCF3; /* Dashed border to indicate editability */
      display: inline-block;
      min-width: 80px;
      cursor: text;
    }
    
    /* Allegiance group container */
    .allegiance-group {
      margin-bottom: 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- 
  ============================================================================
  NAVIGATION MENU SECTION
  ============================================================================
  This section contains the main navigation menu that allows users to switch
  between the three main pages of the application:
  - Registration Page: For registering new users with their Neoband
  - Factions Page: For managing faction-related data
  - Allegiances Page: For managing allegiance relationships
  ============================================================================
  -->
  <nav class="nav-menu">
    <ul>
      <li><a href="#" onclick="showPage('registrationPage')">Registration</a></li>
      <li><a href="#" onclick="showPage('factionPage')">Factions</a></li>
      <li><a href="#" onclick="showPage('allegiancesPage')">Allegiances</a></li>
    </ul>
  </nav>

  <!-- 
  ============================================================================
  REGISTRATION PAGE
  ============================================================================
  This page handles the initial user registration process:
  - Allows setting a new username (max 32 characters)
  - Displays the scanned band ID
  - Shows the current registration status
  - Provides buttons for scanning, reading, writing, and resetting the band
  
  NFC Operations:
  - SCAN: Reads the band's unique ID
  - READ: Retrieves the username from addresses 240
  - WRITE: Writes the username to addresses 240
  - RESET: Clears the username from the band
  ============================================================================
  -->
  <div id="registrationPage" class="page active">
    <h2>User Registration</h2>
    <div>
      <label>New Username:</label><br>
      <input id="usernameInput" class="input" type="text" maxlength="16" placeholder="Enter new username (max 16 chars)">
    </div>
    <div>
      <label>Band ID:</label><br>
      <input id="bandIdInput" class="input" type="text" readonly placeholder="Waiting for band...">
    </div>
    <div>
      <label>Status:</label><br>
      <input id="statusInput" class="status-display" type="text" readonly placeholder="Unregistered" value="Unregistered">
    </div>
    <div style="margin-top:20px;">
      <button class="read-write-button" onclick="handleScanTag()">SCAN</button>
      <button class="read-write-button" onclick="handleReadRegistration()">READ</button>
      <button class="read-write-button" onclick="handleWriteRegistration()">WRITE</button>
      <button class="read-write-button" onclick="handleResetRegistration()">RESET</button>
    </div>
    <div style="margin-top:10px;">
      <button class="read-write-button" onclick="toggleLogDisplay('registrationLogDisplay')" style="background-color:#333; font-size:14px;">SHOW/HIDE LOG</button>
    </div>
  </div>

  <!-- 
  ============================================================================
  FACTION PAGE
  ============================================================================
  This page manages faction-related data for a registered user:
  - Displays the username from the scanned band
  - Allows setting Hunter/Bounty status
  - Tracks number of wins
  - Records best draw time
  - Allows editing faction title
  
  NFC Operations:
  - READ: Retrieves faction data from addresses 4 (username), 8 (hunter/bounty),
          9 (wins), and 10 (draw time)
  - WRITE: Writes faction data to addresses 8, 9, and 10
  ============================================================================
  -->
  <div id="factionPage" class="page">
    <h2>Factions</h2>
    <div>
      <label>Faction Username:</label><br>
      <input id="factionUsernameField" class="input" type="text" readonly placeholder="Waiting for scan...">
    </div>
    <div>
      <label>Hunter/Bounty:</label><br>
      <input id="hunterBountyInput" class="input" type="text" placeholder="Enter Hunter/Bounty">
    </div>
    <div>
      <label># of Wins:</label><br>
      <input id="winsInput" class="input" type="text" placeholder="Enter # of wins">
    </div>
    <div>
      <label>Best Draw Time:</label><br>
      <input id="drawTimeInput" class="input" type="text" placeholder="Enter Best Draw Time">
    </div>
    <div>
      <label>Faction Title:</label><br>
      <div id="factionTitle" class="editable-label" contenteditable="true">ALLEYCAT</div>
    </div>
    <div style="margin-top:20px;">
      <button class="read-write-button" onclick="handleScanTag()">SCAN</button>
      <button class="read-write-button" onclick="handleReadFaction()">READ</button>
      <button class="read-write-button" onclick="handleWriteFaction()">WRITE</button>
    </div>
    <div style="margin-top:10px;">
      <button class="read-write-button" onclick="toggleLogDisplay('factionLogDisplay')" style="background-color:#333; font-size:14px;">SHOW/HIDE LOG</button>
    </div>
  </div>

  <!-- 
  ============================================================================
  ALLEGIANCES PAGE
  ============================================================================
  This page manages allegiance relationships for a registered user:
  - Displays the username from the scanned band
  - Provides 16 editable allegiance fields
  - Each allegiance has an editable label and input field
  
  NFC Operations:
  - READ: Retrieves allegiance data from address 240 (username) and addresses
          12-32 (16 allegiance fields)
  - WRITE: Writes allegiance data to addresses 240 and 12-32
  
  Note: The 16 allegiance fields are dynamically generated in JavaScript
  ============================================================================
  -->
  <div id="allegiancesPage" class="page">
    <h2>Allegiances</h2>
    <div>
      <label>Allegiances Username:</label><br>
      <input id="allegiancesUsernameField" class="input" type="text" readonly placeholder="Waiting for scan...">
    </div>
    <!-- Container for 16 dynamically generated allegiance fields -->
    <div id="allegiancesContainer">
      <!-- We will create 16 groups dynamically in JavaScript -->
    </div>
    <div style="margin-top:20px;">
      <button class="read-write-button" onclick="handleScanTag()">SCAN</button>
      <button class="read-write-button" onclick="handleReadAllegiances()">READ</button>
      <button class="read-write-button" onclick="handleWriteAllegiances()">WRITE</button>
    </div>
    <div style="margin-top:10px;">
      <button class="read-write-button" onclick="toggleLogDisplay('allegiancesLogDisplay')" style="background-color:#333; font-size:14px;">SHOW/HIDE LOG</button>
    </div>
  </div>

  <!-- 
  ============================================================================
  JAVASCRIPT SECTION
  ============================================================================
  This section contains all the JavaScript functionality for the Neoband App,
  organized into logical sections:
  
  1. Utility Functions:
     - Navigation and page management
     - Sleep function for timing operations
     - Text-to-hex and hex-to-text conversion
     - Padding functions for NFC data
  
  2. NFC Communication Functions:
     - Generic read/write functions for NFC operations
     - Address-specific read/write operations
  
  3. Page-Specific Functions:
     - Registration page handlers
     - Faction page handlers
     - Allegiances page handlers
  ============================================================================
  -->
  <script>
    //==========================================================================
    // NFC MEMORY MAP CONFIGURATION
    //==========================================================================
    
    /**
     * Comprehensive mapping of the MIFARE Classic 4K memory structure based on
     * the memory allocation map in the CSV file.
     * 
     * Organization:
     * - Sector 0: Manufacturer data (Do Not Use)
     * - Sectors 1-31: Factions data
     * - Sectors 16, 32-35: Reserved sectors (Do Not Use)
     * - Sectors 36-38: Allegiances data
     * - Sector 39: User registration data
     */
    const nfcFieldMap = {
      // User Registration Data (Sector 39)
      userData: {
        username: {
          block: 240, // Only using Block 0 of Sector 39
          maxLength: 16,
          description: "Username (16 characters in one block)"
        },
        status: {
          block: 242, // Block 2 of Sector 39
          maxLength: 16,
          description: "Band registration status"
        },
        allegiance: {
          block: 243, // Block 3 of Sector 39
          maxLength: 16,
          description: "Affiliated allegiance"
        }
      },
      
      // Factions (Sectors 1-31, excluding sector 16)
      factions: {
        // Faction #1 (Alleycat) - Sector 1
        alleycat: {
          hunterBounty: {
            block: 4, // Sector 1, Block 0
            maxLength: 16,
            description: "Hunter/Bounty status"
          },
          wins: {
            block: 5, // Sector 1, Block 1
            maxLength: 16,
            description: "Number of wins"
          },
          drawTime: {
            block: 6, // Sector 1, Block 2
            maxLength: 16,
            description: "Best draw time"
          }
          // Block 7 is a trailer block - not for data
        }
        // Additional factions can be added following the same pattern
      },
      
      // Allegiances (Sectors 36-38)
      allegiances: {
        // Allegiance #1 (Endline) - Sector 36
        endline: {
          fields: Array(15).fill().map((_, i) => ({
            block: 192 + i, // Blocks 0-14 of Sector 36
            maxLength: 16,
            description: `Endline Field ${i+1}`
          }))
          // Block 207 is a trailer block - not for data
        },
        // Allegiance #2 (Helix) - Sector 37
        helix: {
          fields: Array(15).fill().map((_, i) => ({
            block: 208 + i, // Blocks 0-14 of Sector 37
            maxLength: 16,
            description: `Helix Field ${i+1}`
          }))
          // Block 223 is a trailer block - not for data
        },
        // Allegiance #3 (The Resistance) - Sector 38
        resistance: {
          fields: Array(15).fill().map((_, i) => ({
            block: 224 + i, // Blocks 0-14 of Sector 38
            maxLength: 16,
            description: `The Resistance Field ${i+1}`
          }))
          // Block 239 is a trailer block - not for data
        }
      },
      
      // Trailer blocks and restricted sectors
      protectedBlocks: {
        // Trailer blocks (last block in each sector)
        trailerBlocks: new Set([
          3, 7, 11, 15, 19, 23, 27, 31, 35, 39, 43, 47, 51, 55, 59, 63,
          67, 71, 75, 79, 83, 87, 91, 95, 99, 103, 107, 111, 115, 119, 123, 127,
          143, 159, 175, 191, 207, 223, 239, 255
        ]),
        
        // Restricted sectors (Manufacturer, Reserved)
        restrictedSectors: new Set([
          0, 16, 32, 33, 34, 35
        ])
      }
    };
    
    /**
     * COMPLETE_MEMORY_MAP - Comprehensive mapping of all 255 blocks in the MIFARE Classic 4K card
     * This provides complete mapping for all 180 usable data fields across all 40 sectors
     * Based on the MIFARE_4K_Memory_Map_Annotated.csv file
     */
    const COMPLETE_MEMORY_MAP = {
      // Manufacturer sector - Do Not Use
      0: { 
        type: 'reserved',
        name: 'Manufacturer',
        blocks: [
          { id: 0, type: 'data', description: 'Do Not Use', reserved: true },
          { id: 1, type: 'data', description: 'Do Not Use', reserved: true },
          { id: 2, type: 'data', description: 'Do Not Use', reserved: true },
          { id: 3, type: 'trailer', description: 'Sector Trailer', reserved: true }
        ]
      },

      // Factions (Sectors 1-31, excluding 16)
      // 30 factions × 3 fields = 90 faction fields
      ...Array.from({length: 31}, (_, i) => i + 1)
        .filter(sector => sector !== 16)
        .reduce((acc, sector) => {
          const baseBlock = sector * 4;
          const factionNum = sector;
          
          acc[sector] = {
            type: 'faction',
            name: sector === 1 ? 'Alleycat' : `Faction #${factionNum}`,
            blocks: [
              { 
                id: baseBlock, 
                type: 'data', 
                field: 'Field #1',
                description: sector === 1 ? 'Hunter/Bounty' : `Faction #${factionNum} Field #1` 
              },
              { 
                id: baseBlock + 1, 
                type: 'data', 
                field: 'Field #2',
                description: sector === 1 ? '# of Wins' : `Faction #${factionNum} Field #2` 
              },
              { 
                id: baseBlock + 2, 
                type: 'data', 
                field: 'Field #3',
                description: sector === 1 ? 'Best Draw Time' : `Faction #${factionNum} Field #3` 
              },
              { 
                id: baseBlock + 3, 
                type: 'trailer',
                description: 'Sector Trailer' 
              }
            ]
          };
          return acc;
        }, {}),

      // Reserved Sector - Do Not Use
      16: {
        type: 'reserved',
        name: 'Reserved',
        blocks: Array(4).fill().map((_, i) => ({
          id: 64 + i,
          type: i === 3 ? 'trailer' : 'data',
          description: 'Do Not Use',
          reserved: true
        }))
      },

      // Reserved 4-block sectors 32-35 - Do Not Use
      // Sectors 32-39 are large 16-block sectors
      ...Array.from({length: 4}, (_, i) => i + 32).reduce((acc, sector) => {
        const baseBlock = 128 + (sector - 32) * 16;
        
        acc[sector] = {
          type: 'reserved',
          name: 'Reserved',
          blocks: Array(16).fill().map((_, i) => ({
            id: baseBlock + i,
            type: i === 15 ? 'trailer' : 'data',
            description: 'Do Not Use',
            reserved: true
          }))
        };
        return acc;
      }, {}),

      // Allegiances (Sectors 36-38)
      // 3 allegiances × 15 fields = 45 allegiance fields
      36: {
        type: 'allegiance',
        name: 'Endline',
        blocks: Array(16).fill().map((_, i) => ({
          id: 192 + i,
          type: i === 15 ? 'trailer' : 'data',
          field: i < 15 ? `Allegiance #1 Field ${i+1}` : null,
          description: i < 15 ? `Endline Field ${i+1}` : 'Sector Trailer'
        }))
      },
      37: {
        type: 'allegiance',
        name: 'Helix',
        blocks: Array(16).fill().map((_, i) => ({
          id: 208 + i,
          type: i === 15 ? 'trailer' : 'data',
          field: i < 15 ? `Allegiance #2 Field ${i+1}` : null,
          description: i < 15 ? `Helix Field ${i+1}` : 'Sector Trailer'
        }))
      },
      38: {
        type: 'allegiance',
        name: 'The Resistance',
        blocks: Array(16).fill().map((_, i) => ({
          id: 224 + i,
          type: i === 15 ? 'trailer' : 'data',
          field: i < 15 ? `Allegiance #3 Field ${i+1}` : null,
          description: i < 15 ? `The Resistance Field ${i+1}` : 'Sector Trailer'
        }))
      },

      // User Registration (Sector 39)
      // 15 user fields (of which only a few are used)
      39: {
        type: 'user',
        name: 'User Registration',
        blocks: Array(16).fill().map((_, i) => {
          let field, description;
          
          switch(i) {
            case 0:
              field = 'Username';
              description = 'Username';
              break;
            case 1:
              field = 'Username';
              description = 'Username (Extended)';
              break;
            case 2:
              field = 'Status';
              description = 'Band Status';
              break;
            case 3:
              field = 'Affiliated Allegiance';
              description = 'Allegiance Name';
              break;
            default:
              field = `User Data Field ${i+1}`;
              description = `User Data Field ${i+1}`;
          }
          
          return {
            id: 240 + i,
            type: i === 15 ? 'trailer' : 'data',
            field: i < 15 ? field : null,
            description: i < 15 ? description : 'Sector Trailer'
          };
        })
      }
    };

    /**
     * FULL_SECTOR_MAP - Simplified sector configuration for development use
     * Provides high-level organization of 180 fields across the card's sectors
     * Can be used for sector-based operations and field counting
     */
    const FULL_SECTOR_MAP = {
      factions: {
        sectors: Array.from({length: 31}, (_, i) => i + 1).filter(n => n !== 16),
        fieldsPerSector: 3,
        totalFields: 90,  // 30 sectors × 3 fields
        blockType: 'small' // 4-block sectors
      },
      allegiances: {
        sectors: [36, 37, 38],
        fieldsPerSector: 15,
        totalFields: 45,  // 3 sectors × 15 fields
        blockType: 'large' // 16-block sectors
      },
      user: {
        sector: 39,
        fields: 15,
        totalFields: 15,  // 1 sector × 15 fields
        blockType: 'large' // 16-block sector
      },
      reserved: {
        sectors: [0, 16, 32, 33, 34, 35],
        fields: 0,
        totalFields: 0,   // Reserved sectors do not contain usable fields
        blockType: 'mixed' // Mix of small and large sectors
      }
    };

    /**
     * Helper function to get a block's configuration based on its block ID
     * @param {number} blockId - The linear block ID (0-255)
     * @returns {Object|null} - The block's configuration or null if not found
     */
    function getBlockConfig(blockId) {
      // Calculate sector and block within sector
      const addrInfo = calculateMifareAddress(blockId);
      const sector = addrInfo.sector;
      
      // Get sector configuration
      const sectorConfig = COMPLETE_MEMORY_MAP[sector];
      if (!sectorConfig) return null;
      
      // Find the block within the sector
      return sectorConfig.blocks.find(block => block.id === blockId) || null;
    }

    /**
     * Helper function to get all blocks for a specific field type
     * @param {string} fieldType - Type of field ('faction', 'allegiance', 'user')
     * @returns {Array} - Array of block configurations
     */
    function getFieldBlocks(fieldType) {
      const result = [];
      
      // Iterate through all sectors
      for (const [sectorId, sectorConfig] of Object.entries(COMPLETE_MEMORY_MAP)) {
        // Skip if not the requested type
        if (sectorConfig.type !== fieldType) continue;
        
        // Add all data blocks (not trailer blocks)
        for (const block of sectorConfig.blocks) {
          if (block.type === 'data' && !block.reserved) {
            result.push(block);
          }
        }
      }
      
      return result;
    }
    
    /**
     * Find a field by name across all sectors
     * @param {string} fieldName - The name of the field to find
     * @returns {Object|null} - The field configuration or null if not found
     */
    function findFieldByName(fieldName) {
      // Case-insensitive search
      const normalizedName = fieldName.toLowerCase();
      
      // Search all sectors
      for (const [sectorId, sectorConfig] of Object.entries(COMPLETE_MEMORY_MAP)) {
        // Skip reserved sectors
        if (sectorConfig.type === 'reserved') continue;
        
        // Check each block in the sector
        for (const block of sectorConfig.blocks) {
          // Skip trailer blocks
          if (block.type === 'trailer') continue;
          
          // Check if field or description matches
          if (block.field && block.field.toLowerCase().includes(normalizedName)) {
            return { 
              block: block, 
              sector: parseInt(sectorId),
              address: block.id,
              type: sectorConfig.type,
              groupName: sectorConfig.name
            };
          }
          
          if (block.description && block.description.toLowerCase().includes(normalizedName)) {
            return { 
              block: block, 
              sector: parseInt(sectorId),
              address: block.id,
              type: sectorConfig.type,
              groupName: sectorConfig.name
            };
          }
        }
      }
      
      return null;
    }
    
    /**
     * Get all fields for a specific faction or allegiance by name
     * @param {string} groupName - The name of the faction or allegiance
     * @returns {Array} - Array of field configurations
     */
    function getFieldsByGroupName(groupName) {
      const normalizedName = groupName.toLowerCase();
      const result = [];
      
      // Search all sectors
      for (const [sectorId, sectorConfig] of Object.entries(COMPLETE_MEMORY_MAP)) {
        // Skip if name doesn't match
        if (!sectorConfig.name || !sectorConfig.name.toLowerCase().includes(normalizedName)) {
          continue;
        }
        
        // Add all data blocks for the matching group
        for (const block of sectorConfig.blocks) {
          if (block.type === 'data' && !block.reserved) {
            result.push({ 
              block: block, 
              sector: parseInt(sectorId),
              address: block.id,
              type: sectorConfig.type,
              groupName: sectorConfig.name
            });
          }
        }
      }
      
      return result;
    }
    
    /**
     * Read all fields for a specific faction or allegiance
     * @param {string} groupName - The name of the faction or allegiance
     * @returns {Promise<Array>} - Array of {fieldName, value} objects
     */
    async function readAllFieldsForGroup(groupName) {
      const fields = getFieldsByGroupName(groupName);
      const results = [];
      
      // Process fields sequentially to prevent NFC collisions
      for (const field of fields) {
        try {
          const value = await readField(field.address.toString());
          results.push({
            fieldName: field.block.field || field.block.description,
            blockId: field.address,
            value: value
          });
        } catch (error) {
          console.error(`Error reading field ${field.block.field || field.block.description}:`, error);
          results.push({
            fieldName: field.block.field || field.block.description,
            blockId: field.address,
            value: null,
            error: error.toString()
          });
        }
      }
      
      return results;
    }
    
    /**
     * Calculate block address from sector and block-within-sector
     * @param {number} sector - The sector number (0-39)
     * @param {number} blockInSector - The block within the sector
     * @returns {number} - The absolute block address
     */
    function calculateBlockAddress(sector, blockInSector) {
      // For sectors 0-31 (small sectors with 4 blocks each)
      if (sector <= 31) {
        if (blockInSector > 3) {
          throw new Error(`Invalid block number ${blockInSector} for small sector ${sector}`);
        }
        return (sector * 4) + blockInSector;
      }
      
      // For sectors 32-39 (large sectors with 16 blocks each)
      if (sector <= 39) {
        if (blockInSector > 15) {
          throw new Error(`Invalid block number ${blockInSector} for large sector ${sector}`);
        }
        return 128 + ((sector - 32) * 16) + blockInSector;
      }
      
      throw new Error(`Invalid sector number: ${sector}`);
    }
    
    /**
     * Check if a field exists in the memory map
     * @param {number} blockId - The absolute block ID to check
     * @returns {boolean} - True if the field exists and is not reserved
     */
    function fieldExists(blockId) {
      const config = getBlockConfig(blockId);
      return config !== null && config.type === 'data' && !config.reserved;
    }
    
    /**

    /**
     * DataHandler - A unified class for encoding and decoding data to/from NFC fields
     * Provides consistent handling of different data types (text, numbers, mixed content)
     * NOTE: Currently disabled to restore original functionality
     */
    class DataHandler {
      static MAX_LENGTH = 16; // Maximum length for NFC card fields
      
      /**
       * Encodes any value to a hex representation for NFC storage
       * Uses the same encoding method as the username fields
       * @param {any} payload - The value to encode (will be converted to string)
       * @returns {string} - Hex representation of the input
       */
      static encode(payload) {
        // Converting to string and ensuring proper length
        const strVal = String(payload || "").slice(0, this.MAX_LENGTH);
        
        // Convert text to hex using the same method as textToHex
        return Array.from(strVal)
          .map(c => c.charCodeAt(0).toString(16).padStart(2, '0'))
          .join('');
      }
      
      /**
       * Decodes hex data from NFC storage to string
       * Uses the same decoding method as the username fields
       * @param {string} hexStr - Hex string to decode
       * @returns {string} - Decoded string value
       */
      static decode(hexStr) {
        if (!hexStr) return '';
        
        // Remove any 0x prefix if present
        if (hexStr.startsWith('0x') || hexStr.startsWith('0X')) {
          hexStr = hexStr.slice(2);
        }
        
        // Remove trailing FF padding (standard for NFC storage)
        hexStr = hexStr.replace(/(FF)+$/i, "");
        
        // Convert hex pairs to characters - same method as hexToText
        return hexStr.match(/.{2}/g)?.map(p => 
          String.fromCharCode(parseInt(p, 16))).join('').trim() || '';
      }
      
      /**
       * Pads hex data to the required length for NFC storage
       * @param {string} hexData - Hex string to pad
       * @param {number} byteLength - Target length in bytes (default: 16)
       * @returns {string} - Padded hex string
       */
      static padHex(hexData, byteLength = 16) {
        const targetLength = byteLength * 2; // 2 hex chars per byte
        
        // Truncate if too long
        if (hexData.length > targetLength) {
          return hexData.substring(0, targetLength);
        }
        
        // Pad with FF if too short - same method as padHex function
        while (hexData.length < targetLength) {
          hexData += "FF";
        }
        
        return hexData;
      }
      
      // Other utility methods remain unchanged
      static getSectorType(sector) {
        for (const [type, config] of Object.entries(SECTOR_CONFIG)) {
          if (config.sectors.includes(sector)) {
            return type;
          }
        }
        return null;
      }
      
      static getSectorDelay(sector) {
        const sectorType = this.getSectorType(sector);
        if (sectorType && SECTOR_CONFIG[sectorType]) {
          return SECTOR_CONFIG[sectorType].delay;
        }
        return 800; // Default delay if not specified
      }
    }

     * @param {number} ms - Milliseconds to wait

     */
    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));

    /**
     * Converts text string to hexadecimal representation
     * @param {string} text - Text to convert
     * @returns {string} - Hexadecimal representation
     */
    function textToHex(text) {
      var hex = "";
      for (var i = 0; i < text.length; i++) {
        hex += text.charCodeAt(i).toString(16).padStart(2, '0');
      }
      return hex;
    }

    /**
     * Pads a hex string to the specified length with "FF"
     * @param {string} hexStr - Hex string to pad
     * @param {number} totalLength - Target length
     * @returns {string} - Padded hex string
     */
    function padHex(hexStr, totalLength) {
      while (hexStr.length < totalLength) {
        hexStr += "FF";
      }
      return hexStr;
    }

    /**
     * Converts hex string to text, trimming trailing "FF" padding
     * @param {string} hexStr - Hex string to convert
     * @returns {string} - Resulting text
     */
    function hexToText(hexStr) {
      // Remove trailing FF padding
      hexStr = hexStr.replace(/(FF)+$/i, "");
      var text = "";
      for (var i = 0; i < hexStr.length; i += 2) {
        text += String.fromCharCode(parseInt(hexStr.substr(i, 2), 16));
      }
      return text;
    }

    /**
     * Converts a hex string to a byte array for NFC operations
     * @param {string} hexStr - Hex string to convert (e.g., "FFFFFFFFFFFF")
     * @returns {Array} - Array of byte values
     */
    function hexToBytes(hexStr) {
      if (!hexStr) return [];
      
      // Ensure hexStr has an even number of characters
      if (hexStr.length % 2 !== 0) {
        hexStr = "0" + hexStr;
      }
      
      var bytes = [];
      for (var i = 0; i < hexStr.length; i += 2) {
        bytes.push(parseInt(hexStr.substr(i, 2), 16));
      }
      return bytes;
    }

    /**
     * Converts sector and block to a linear block address
     * @param {number} sector - The sector number (0-39)
     * @param {number} block - The block within the sector (0-3 for sectors 0-31, 0-15 for sectors 32-39)
     * @returns {number} - The linear block address
     */
    function getLinearAddress(sector, block) {
      if (sector < 0 || sector > 39) {
        throw new RangeError('Invalid sector number: ' + sector);
      }
      
      const maxBlock = sector <= 31 ? 3 : 15;
      if (block < 0 || block > maxBlock) {
        throw new RangeError(`Invalid block number: ${block} for sector: ${sector}`);
      }
      
      return sector <= 31 ? (sector * 4) + block : (128 + ((sector - 32) * 16)) + block;
    }
    
    /**
     * Authenticates with a specific sector using the appropriate authentication parameters
     * @param {number} sector - The sector to authenticate with
     * @returns {Object} - Authentication parameters to be used in commands
     */
    function authenticateSector(sector) {
      // First check for explicit sector authentication in SECTOR_AUTH
      if (SECTOR_AUTH[sector]) {
        return {
          mode: SECTOR_AUTH[sector].mode,
          key: SECTOR_AUTH[sector].key,
          delay: SECTOR_AUTH[sector].delay
        };
      }
      
      // If not explicitly defined, determine parameters based on sector type
      let delay = 800; // Default delay
      
      // Use FULL_SECTOR_MAP to determine sector type
      if (FULL_SECTOR_MAP.factions.sectors.includes(sector)) {
        delay = 2900; // Faction sectors use longer delay
      } else if (FULL_SECTOR_MAP.allegiances.sectors.includes(sector)) {
        delay = 2900; // Allegiance sectors use longer delay
      } else if (sector === FULL_SECTOR_MAP.user.sector) {
        delay = 600;  // User sector uses shorter delay
      } else if (FULL_SECTOR_MAP.reserved.sectors.includes(sector)) {
        console.warn(`Attempting to authenticate with reserved sector ${sector}`);
      }
      
      console.warn(`No specific authentication config for sector ${sector}, using determined delay: ${delay}ms`);
      
      return {
        mode: DEFAULT_AUTH.mode,
        keyIndex: DEFAULT_AUTH.keyIndex,
        delay: delay
      };
    }
    
    /**
     * Reads text data from a specific NFC address with retry mechanism
     * @param {string} address - NFC memory address
     * @param {number} retryCount - Number of retries attempted (default: 0)
     * @returns {Promise<string>} - Resolves with the read text
     */
    async function readField(address, retryCount = 0) {
      // Validate the address before proceeding
      const validation = validateAddress(parseInt(address), false);
      if (!validation.valid) {
        throw new Error(validation.reason);
      }
      
      // Get address information for proper authentication
      const addrInfo = validation.addressInfo;
      
      // Get sector-specific authentication parameters
      const authParams = authenticateSector(addrInfo.sector);
      
      // Prepare authentication parameters for the command
      const auth_mode = ` ${authParams.mode}`;
      const key_index = authParams.keyIndex !== undefined ? authParams.keyIndex : DEFAULT_AUTH.keyIndex;
      
      // Use sector-specific delay
      const sectorDelay = authParams.delay || 800;
      
      // Log the sector we're accessing for debugging
      console.log(`Reading from address ${address} (Sector ${addrInfo.sector}, Block ${addrInfo.blockInSector})`);
      console.log(`Using auth mode: ${authParams.mode}, sector: ${addrInfo.sector}, delay: ${sectorDelay}ms`);
      
      // Build command
      const command = `LinearRead h ${address} 16${auth_mode} ${key_index}`;
      
      // Add delay to ensure NFC operations don't overlap - using sector-specific delay
      await sleep(sectorDelay);
      
      return new Promise(function(resolve, reject) {
        ufRequest(command, function() {
          var output = ufResponse();
          if (output.Status === "[0x00 (0)] UFR_OK") {
            var rawHex = output.Data;
            if(rawHex.startsWith("0x") || rawHex.startsWith("0X")) {
              rawHex = rawHex.slice(2);
            }
            // Use DataHandler.decode for consistent decoding across the app
            resolve(DataHandler.decode(rawHex));
          } else if (output.Status.includes("UFR_AUTH_ERROR")) {
            // If authentication fails, try with Key B instead
            console.log(`Auth failed with Key A for address ${address}, trying Key B...`);
            tryAlternativeAuth(address, addrInfo.sector, sectorDelay, resolve, reject);
          } else if (retryCount < 3 && !output.Status.includes("UFR_NO_CARD")) {
            // Progressive retry with exponential backoff for reliability
            console.log(`Read operation failed, retrying (${retryCount + 1}/3)...`);
            const backoffMultiplier = addrInfo.sector === 36 ? 2.0 : 1.5; // Higher backoff for allegiances
            const nextDelay = Math.min(sectorDelay * backoffMultiplier, 5000); // Cap at 5 seconds
            
            // Use setTimeout to avoid deep recursion
            setTimeout(() => {
              readField(address, retryCount + 1)
                .then(resolve)
                .catch(reject);
            }, 1000); // Wait a second before retrying
          } else {
            // Enhanced error message with sector/block info
            reject(`Read failed at address ${address} (Sector ${addrInfo.sector}, Block ${addrInfo.blockInSector}): ${output.Status}`);
          }
        });
      });
    }
    
    /**
     * Tries an alternative authentication method (Key B) for reading
     * @param {string} address - NFC memory address
     * @param {number} sector - The sector number to authenticate with
     * @param {number} delay - The delay to use for this sector
     * @param {Function} resolve - Promise resolve function
     * @param {Function} reject - Promise reject function
     */
    function tryAlternativeAuth(address, sector, delay, resolve, reject) {
      // Use Key B (0x61) instead of Key A (0x60)
      const auth_mode = " 0x61";  // Key B authentication
      
      // If we have a sector-specific Key B, we'll use that key index
      // Otherwise, fallback to the default key index
      const key_index = DEFAULT_AUTH.keyIndex;
      
      console.log(`Trying alternative auth (Key B) for sector ${sector}`);
      
      const command = `LinearRead h ${address} 16${auth_mode} ${key_index}`;
      
      // Add a delay before trying alternative authentication to allow the reader to reset
      setTimeout(() => {
        ufRequest(command, function() {
          var output = ufResponse();
          if (output.Status === "[0x00 (0)] UFR_OK") {
            var rawHex = output.Data;
            if(rawHex.startsWith("0x") || rawHex.startsWith("0X")) {
              rawHex = rawHex.slice(2);
            }
            // Use DataHandler.decode for consistent decoding
            console.log(`Successfully read with Key B from address ${address}`);
            resolve(DataHandler.decode(rawHex));
          } else {
            // If both auth methods fail, reject with detailed error
            reject(`Read failed with both Key A and Key B at address ${address}: ${output.Status}`);
          }
        });
      }, delay); // Wait for the sector-specific delay before trying Key B authentication
    }

    /**
     * Writes text data to a specific NFC address with retry mechanism
     * @param {string} address - NFC memory address
     * @param {string} text - Text to write
     * @param {number} retryCount - Number of retries attempted (default: 0)
     * @returns {Promise} - Resolves when write is complete
     */
    async function writeField(address, text, retryCount = 0) {
      // Validate the address before proceeding (enforce write restrictions)
      const validation = validateAddress(parseInt(address), true);
      if (!validation.valid) {
        throw new Error(validation.reason);
      }
      
      // Get address information for proper authentication
      const addrInfo = validation.addressInfo;
      
      // Get sector-specific authentication parameters
      const authParams = authenticateSector(addrInfo.sector);
      
      // Prepare authentication parameters for the command
      const auth_mode = ` ${authParams.mode}`;

      console.log(`Using auth mode: ${authParams.mode}, sector: ${addrInfo.sector}, delay: ${sectorDelay}ms`);
      
      // Use DataHandler.encode and padHex for consistent encoding across the app
      var hexData = DataHandler.encode(text);
      hexData = DataHandler.padHex(hexData);
      
      // Build command
      const command = `LinearWrite 0x${hexData} ${address} 16${auth_mode} ${key_index}`;
      
      // Add delay to ensure NFC operations don't overlap - using sector-specific delay
      await sleep(sectorDelay);
      
      return new Promise(function(resolve, reject) {
        ufRequest(command, function() {
          var output = ufResponse();
          if (output.Status === "[0x00 (0)] UFR_OK") {
            resolve();
          } else if (output.Status.includes("UFR_AUTH_ERROR")) {
            // If authentication fails, try with Key B instead
            console.log(`Auth failed with Key A for address ${address}, trying Key B...`);
            tryAlternativeAuthWrite(address, hexData, addrInfo.sector, sectorDelay, resolve, reject);
          } else if (retryCount < 3 && !output.Status.includes("UFR_NO_CARD")) {
            // Progressive retry with exponential backoff for reliability
            console.log(`Write operation failed, retrying (${retryCount + 1}/3)...`);
            const backoffMultiplier = addrInfo.sector === 36 ? 2.0 : 1.5; // Higher backoff for allegiances
            const nextDelay = Math.min(sectorDelay * backoffMultiplier, 5000); // Cap at 5 seconds
            
            // Use setTimeout to avoid deep recursion
            setTimeout(() => {
              writeField(address, text, retryCount + 1)
                .then(resolve)
                .catch(reject);
            }, 1000); // Wait a second before retrying
          } else {
            // Enhanced error message with sector/block info
            reject(`Write failed at address ${address} (Sector ${addrInfo.sector}, Block ${addrInfo.blockInSector}): ${output.Status}`);
          }
        });
      });
    }

    function tryAlternativeAuthWrite(address, hexData, sector, delay, resolve, reject) {

    /**
     * Dynamically builds the 16 allegiance fields
     * Creates editable labels and input fields for each allegiance
     */
    function buildAllegiancesFields() {
      var container = document.getElementById("allegiancesContainer");
      // Only build if not already built
      if (container.childElementCount > 0) return;
      
      // Create 16 allegiance field groups
      for (var i = 1; i <= 16; i++) {
        // Create a group div
        var group = document.createElement("div");
        group.className = "allegiance-group";
        
        // Create an editable label
        var label = document.createElement("div");
        label.className = "editable-label";
        label.contentEditable = "true";
        label.innerText = "TEXT " + i;
        
        // Create an input field
        var input = document.createElement("input");
        input.type = "text";
        input.className = "input";
        input.placeholder = "Enter text";
        
        // Set an ID for the input
        input.id = "allegiance" + i;
        
        // Append label and input to the group
        group.appendChild(label);
        group.appendChild(document.createElement("br"));
        group.appendChild(input);
        
        // Append the group to the container
        container.appendChild(group);
      }
    }

    /**
     * Gets the address for a specific allegiance field
     * @param {number} index - The field index (1-16)
     * @returns {number} - The block address
     */
    function getAllegianceFieldAddress(index) {
      // Default to Endline (first allegiance)
      const allegiance = "endline";
      
      // Subtract 1 from index since arrays are 0-indexed
      const fieldIndex = index - 1;
      
      // Check if index is valid
      if (fieldIndex < 0 || fieldIndex >= 15) {
        throw new Error(`Invalid allegiance field index: ${index}. Valid range is 1-15.`);
      }
      
      return nfcFieldMap.allegiances[allegiance].fields[fieldIndex].block;
    }

    /**
     * Reads allegiance data from the NFC tag
     * - Username from blocks 240
     * - 16 allegiance fields from their respective addresses
     */
    async function handleReadAllegiances() {
      // Show log display and initialize
      const logDisplay = document.getElementById("allegiancesLogDisplay");
      logDisplay.style.display = "block";
      logDisplay.innerHTML += `<div style='color:#FFFFFF;'>Starting allegiances data read operation...</div>`;
      
      // Show operation indicator
      showOperationIndicator("Reading Allegiances Data");
      
      try {
        // Check if a tag has been scanned
        if (!tagUID) {
          logDisplay.innerHTML += `<div style='color:#FF0000;'>✗ No tag detected. Please use the SCAN button.</div>`;
          updateOperationIndicator("Error: No Tag Detected");
          
          setTimeout(() => {
            hideOperationIndicator();
            showVisualConfirmation("No Tag Detected", "Please use the SCAN button to detect a tag first", "error");
          }, 1000);
          
          alert("Allegiances read error: No tag detected. Please use the SCAN button to detect a tag first.");
          return;
        }
        
        // Update the Allegiances Username (from block 240)
        updateOperationIndicator("Reading Username");
        logDisplay.innerHTML += `<div style='color:#FFFFFF;'>Reading username from block 240...</div>`;
        
        // Get sector-specific information for user data (sector 39)
        const userAuthParams = authenticateSector(39);
        const userDelay = userAuthParams.delay;
        
        logDisplay.innerHTML += `<div style='color:#FFFFFF;'>Applying sector 39 delay (${userDelay}ms)...</div>`;
        await sleep(userDelay);
        
        var allegUser = await readUsername();
        document.getElementById("allegiancesUsernameField").value = allegUser || tagUID + " (Unregistered)";
        
        if (!allegUser) {
          logDisplay.innerHTML += `<div style='color:#FFA500;'>⚠ No username found. This band may not be registered.</div>`;
          updateOperationIndicator("Username Not Found");
        } else {
          logDisplay.innerHTML += `<div style='color:#00FF00;'>✓ Username found: "${allegUser}"</div>`;
        }
        
        // Get allegiance sector (36) authentication parameters
        const allegianceAuthParams = authenticateSector(36);
        const allegianceDelay = allegianceAuthParams.delay;
        
        // Process allegiance fields sequentially to prevent overlapping operations
        let successCount = 0;
        
        // Initial delay before allegiance reads
        logDisplay.innerHTML += `<div style='color:#FFFFFF;'>Preparing for allegiance reads with sector 36 delay (${allegianceDelay}ms)...</div>`;
        updateOperationIndicator("Preparing Allegiance Reads");
        await sleep(allegianceDelay);
        
        // Loop through each allegiance field one at a time (throttled)
        for (var i = 1; i <= 15; i++) {
          try {
            const address = getAllegianceFieldAddress(i);
            updateOperationIndicator(`Reading Allegiance ${i}`);
            logDisplay.innerHTML += `<div style='color:#FFFFFF;'>Reading allegiance ${i} from address ${address}...</div>`;
            
            // Add a validation check
            const addrInfo = calculateMifareAddress(address);
            if (addrInfo.sector === 36 && addrInfo.blockInSector > 15) {
              logDisplay.innerHTML += `<div style='color:#FF0000;'>✗ Invalid block number ${addrInfo.blockInSector} for sector 36</div>`;
              continue;
            }
            
            // Make sure to wait for each read to complete before starting the next one
            var text = await readField(address.toString());
            document.getElementById("allegiance" + i).value = text || "";
            
            if (text) {
              logDisplay.innerHTML += `<div style='color:#00FF00;'>✓ Allegiance ${i} found: "${text}"</div>`;
              successCount++;
            } else {
              logDisplay.innerHTML += `<div style='color:#FFA500;'>⚠ No data found for allegiance ${i}</div>`;
            }
            
            // Update scrolling to show latest entry
            logDisplay.scrollTop = logDisplay.scrollHeight;
            
          } catch (error) {
            // Log the error but continue with the next field
            logDisplay.innerHTML += `<div style='color:#FF0000;'>✗ Error reading allegiance ${i}: ${error}</div>`;
            logDisplay.scrollTop = logDisplay.scrollHeight;
          }
        }
        
        // Operation complete
        updateOperationIndicator("Allegiances Read Complete");
        logDisplay.innerHTML += `<div style='color:#00FF00;'>✓ Allegiances read operation complete. ${successCount} of 15 entries contain data.</div>`;
        
        // Show success confirmation
        setTimeout(() => {
          hideOperationIndicator();
          showVisualConfirmation("Allegiances Data Read", 
            `Successfully read ${successCount} allegiance entries for ${allegUser || "unregistered band"}`, 
            successCount > 0 ? "success" : "warning");
        }, 1000);
      } catch (error) {
        // Log error
        logDisplay.innerHTML += `<div style='color:#FF0000;'>✗ Error reading allegiances data: ${error}</div>`;
        updateOperationIndicator("Read Error");
        
        // Show error confirmation
        setTimeout(() => {
          hideOperationIndicator();
          showVisualConfirmation("Allegiances Read Error", error.toString(), "error");
        }, 1000);
        
        alert("Allegiances read error: " + error);
      }
      
      // Scroll log to bottom
      logDisplay.scrollTop = logDisplay.scrollHeight;
    }

    /**
     * Writes allegiance data to the NFC tag
     * - Username to address 240 (if available)
     * - 15 allegiance fields to their respective addresses
     */
    async function handleWriteAllegiances() {
      // Show log display and initialize
      const logDisplay = document.getElementById("allegiancesLogDisplay");
      logDisplay.style.display = "block";
      logDisplay.innerHTML += `<div style='color:#FFFFFF;'>Starting allegiances data write operation...</div>`;
      
      // Show operation indicator
      showOperationIndicator("Preparing Allegiances Data");
      
      try {
        // Check if a tag has been scanned
        if (!tagUID) {
          logDisplay.innerHTML += `<div style='color:#FF0000;'>✗ No tag detected. Please use the SCAN button.</div>`;
          updateOperationIndicator("Error: No Tag Detected");
          
          setTimeout(() => {
            hideOperationIndicator();
            showVisualConfirmation("No Tag Detected", "Please use the SCAN button to detect a tag first", "error");
          }, 1000);
          
          alert("Allegiances write error: No tag detected. Please use the SCAN button to detect a tag first.");
          return;
        }
        
        // Get authentication parameters for each sector
        const userSectorParams = authenticateSector(39);  // Username sector 39
        const allegSectorParams = authenticateSector(36); // Allegiance sector 36
        
        // Write Allegiances Username (if needed)
        var regUser = document.getElementById("usernameInput").value.trim();
        
        if(regUser) {
          updateOperationIndicator("Writing Username");
          logDisplay.innerHTML += `<div style='color:#FFFFFF;'>Writing username "${regUser}" to address 240...</div>`;
          logDisplay.innerHTML += `<div style='color:#FFFFFF;'>Using sector 39 delay (${userSectorParams.delay}ms)...</div>`;
          
          // Apply sector-specific delay before writing
          await sleep(userSectorParams.delay);
          
          // Write username to block 240 (User registration block)
          await writeUsername(regUser);
          document.getElementById("allegiancesUsernameField").value = regUser;
          
          logDisplay.innerHTML += `<div style='color:#00FF00;'>✓ Username written successfully</div>`;
        } else {
          logDisplay.innerHTML += `<div style='color:#FFA500;'>⚠ No username provided. Skipping username write.</div>`;
        }
        
        // Process allegiance fields sequentially to prevent overlapping operations
        let writtenCount = 0;
        
        // Prepare for allegiance sector operations
        logDisplay.innerHTML += `<div style='color:#FFFFFF;'>Preparing for allegiance writes with sector 36 delay (${allegSectorParams.delay}ms)...</div>`;
        await sleep(allegSectorParams.delay);
        
        // Loop through each allegiance field one at a time (throttled)
        for (var i = 1; i <= 15; i++) {
          try {
            const address = getAllegianceFieldAddress(i);
            var text = document.getElementById("allegiance" + i).value.trim();
            
            updateOperationIndicator(`Writing Allegiance ${i}`);
            logDisplay.innerHTML += `<div style='color:#FFFFFF;'>Writing allegiance ${i} "${text}" to address ${address}...</div>`;
            
            // Make sure to wait for each write to complete before starting the next one
            await writeField(address.toString(), text);
            
            if (text) {
              logDisplay.innerHTML += `<div style='color:#00FF00;'>✓ Allegiance ${i} written successfully</div>`;
              writtenCount++;
            } else {
              logDisplay.innerHTML += `<div style='color:#FFA500;'>⚠ Empty value written for allegiance ${i}</div>`;
            }
            
            // Update scrolling to show latest entry
            logDisplay.scrollTop = logDisplay.scrollHeight;
            
          } catch (error) {
            // Log the error but continue with the next field
            logDisplay.innerHTML += `<div style='color:#FF0000;'>✗ Error writing allegiance ${i}: ${error}</div>`;
            logDisplay.scrollTop = logDisplay.scrollHeight;
          }
        }
        
        // Operation complete
        updateOperationIndicator("Allegiances Write Complete");
        logDisplay.innerHTML += `<div style='color:#00FF00;'>✓ Allegiances write operation complete. ${writtenCount} of 15 entries contain data.</div>`;
        
        // Show success confirmation
        setTimeout(() => {
          hideOperationIndicator();
          showVisualConfirmation("Allegiances Data Written", 
            `Successfully wrote ${writtenCount} allegiance entries`, "success");
        }, 1000);
        
        alert("Allegiances data written successfully!");
      } catch (error) {
        // Log error
        logDisplay.innerHTML += `<div style='color:#FF0000;'>✗ Error writing allegiances data: ${error}</div>`;
        updateOperationIndicator("Write Error");
        
        // Show error confirmation
        setTimeout(() => {
          hideOperationIndicator();
          showVisualConfirmation("Allegiances Write Error", error.toString(), "error");
        }, 1000);
        
        alert("Allegiances write error: " + error);
      }
      
      // Scroll log to bottom
      logDisplay.scrollTop = logDisplay.scrollHeight;
    }

    //==========================================================================
    // NFC LOGGING AND MONITORING FUNCTIONS
    //==========================================================================
    
    // Global variables for NFC tag information
    let tagUID = null;
    let tagIsValid = false;

    /**
     * Gets the UID of the current NFC tag
     * @returns {Promise<string|null>} - The UID of the tag, or null if not present
     */
    async function getTagUID() {
      return new Promise(resolve => {
        ufRequest("GetCardIdEx", function() {
          const response = ufResponse();
          if (response && response.Status === "[0x00 (0)] UFR_OK") {
            tagUID = response.CardUid;
            tagIsValid = true;
            resolve(tagUID);
          } else {
            tagUID = null;
            tagIsValid = false;
            resolve(null);
          }
        });
      });
    }
    
    /**
     * Logs detailed information about NFC operations to the appropriate display
     * @param {string} message - The message to log
     * @param {string} type - The type of message: "info", "success", "error", "warning"
     */
    function logNfcOperation(message, type = "info") {
      const logDisplay = document.getElementById("registrationLogDisplay") || 
                        document.getElementById("factionLogDisplay") ||
                        document.getElementById("allegiancesLogDisplay");
      
      if (!logDisplay) return;
      
      let color = "#FFFFFF"; // Default white for info
      
      if (type === "success") color = "#00FF00";
      else if (type === "error") color = "#FF0000";
      else if (type === "warning") color = "#FFA500";
      
      logDisplay.innerHTML += `<div style='color:${color};'>${type === "success" ? "✓" : type === "error" ? "✗" : type === "warning" ? "⚠" : "•"} ${message}</div>`;
      logDisplay.scrollTop = logDisplay.scrollHeight;
    }
    
    /**
     * Enhanced read operation with logging
     * Wraps the existing readField function with detailed logging
     * @param {string} address - The address to read from
     * @returns {Promise<string>} - The read value
     */
    async function readFieldWithLogging(address) {
      // Show log display for the current page
      showLogDisplay();
      
      const logDisplay = document.getElementById("registrationLogDisplay") || 
                        document.getElementById("factionLogDisplay") ||
                        document.getElementById("allegiancesLogDisplay");
      
      if (logDisplay) {
        logDisplay.style.display = "block";
      }
      
      logNfcOperation(`Reading from address ${address}...`);
      
      // Check if tag is present
      const uid = await getTagUID();
      
      if (!uid) {
        logNfcOperation("No tag detected. Please place a tag on the reader.", "error");
        throw new Error("No tag detected");
      }
      
      logNfcOperation(`Tag detected: ${uid}`, "success");
      
      // Validate the address
      const validation = validateAddress(parseInt(address), false);
      
      if (!validation.valid) {
        logNfcOperation(`Validation failed: ${validation.reason}`, "error");
        throw new Error(validation.reason);
      }
      
      // Get memory address information
      const addrInfo = validation.addressInfo;
      logNfcOperation(`Address ${address} corresponds to Sector ${addrInfo.sector}, Block ${addrInfo.blockInSector} ${addrInfo.isTrailerBlock ? '(TRAILER BLOCK)' : ''}`);
      
      try {
        // Call the readField function
        const result = await readField(address);
        
        logNfcOperation(`Successfully read from address ${address}: "${result}"`, "success");
        return result;
      } catch (error) {
        logNfcOperation(`Error reading from address ${address}: ${error}`, "error");
        throw error;
      }
    }
    
    /**
     * Enhanced write operation with logging
     * Wraps the existing writeField function with detailed logging
     * @param {string} address - The address to write to
     * @param {string} text - The text to write
     * @returns {Promise<void>}
     */
    async function writeFieldWithLogging(address, text) {
      // Show log display for the current page
      showLogDisplay();
      
      const logDisplay = document.getElementById("registrationLogDisplay") || 
                        document.getElementById("factionLogDisplay") ||
                        document.getElementById("allegiancesLogDisplay");
      
      if (logDisplay) {
        logDisplay.style.display = "block";
      }
      
      logNfcOperation(`Writing to address ${address}: "${text}"`);
      
      // Check if tag is present
      const uid = await getTagUID();
      
      if (!uid) {
        logNfcOperation("No tag detected. Please place a tag on the reader.", "error");
        throw new Error("No tag detected");
      }
      
      logNfcOperation(`Tag detected: ${uid}`, "success");
      
      // Validate the address (with write validation)
      const validation = validateAddress(parseInt(address), true);
      
      if (!validation.valid) {
        logNfcOperation(`Validation failed: ${validation.reason}`, "error");
        throw new Error(validation.reason);
      }
      
      // Get memory address information
      const addrInfo = validation.addressInfo;
      logNfcOperation(`Address ${address} corresponds to Sector ${addrInfo.sector}, Block ${addrInfo.blockInSector}`);
      
      if (text.length > 16) {
        logNfcOperation(`Warning: Text length (${text.length}) exceeds 16 characters. Will be truncated.`, "warning");
      }
      
      try {
        // Call the writeField function
        await writeField(address, text);
        
        logNfcOperation(`Successfully wrote to address ${address}`, "success");
      } catch (error) {
        logNfcOperation(`Error writing to address ${address}: ${error}`, "error");
        throw error;
      }
    }

    //==========================================================================
    // VISUAL FEEDBACK AND LOGGING FUNCTIONS
    //==========================================================================
    
    /**
     * Shows a visual confirmation with customizable icon, title, and message
     * @param {string} title - The title of the confirmation
     * @param {string} message - The message to display
     * @param {string} type - Type of confirmation: "success", "error", or "warning"
     */
    function showVisualConfirmation(title, message, type = "success") {
      const confirmBox = document.getElementById("visualConfirmation");
      const icon = document.getElementById("confirmIcon");
      const titleElement = document.getElementById("confirmTitle");
      const messageElement = document.getElementById("confirmMessage");
      
      // Set icon, color based on type
      if (type === "success") {
        icon.innerHTML = "✓";
        icon.style.color = "#00FF00";
        titleElement.style.color = "#00FF00";
      } else if (type === "error") {
        icon.innerHTML = "✗";
        icon.style.color = "#FF0000";
        titleElement.style.color = "#FF0000";
      } else if (type === "warning") {
        icon.innerHTML = "⚠";
        icon.style.color = "#FFA500";
        titleElement.style.color = "#FFA500";
      }
      
      // Set title and message
      titleElement.innerText = title;
      messageElement.innerText = message;
      
      // Show the confirmation
      confirmBox.style.display = "block";
      
      // Auto-hide after 5 seconds for success and warnings
      if (type !== "error") {
        setTimeout(hideVisualConfirmation, 5000);
      }
    }
    
    /**
     * Hides the visual confirmation dialog
     */
    function hideVisualConfirmation() {
      document.getElementById("visualConfirmation").style.display = "none";
    }
    
    /**
     * Shows an operation indicator with a message
     * @param {string} message - The operation message to display
     */
    function showOperationIndicator(message) {
      const indicator = document.getElementById("operationIndicator");
      document.getElementById("operationMessage").innerText = message;
      indicator.style.display = "block";
    }
    
    /**
     * Updates the text in the operation indicator
     * @param {string} message - The new message to display
     */
    function updateOperationIndicator(message) {
      document.getElementById("operationMessage").innerText = message;
    }
    
    /**
     * Hides the operation indicator
     */
    function hideOperationIndicator() {
      document.getElementById("operationIndicator").style.display = "none";
    }
    
    /**
     * Shows the appropriate log display based on active page
     */
    function showLogDisplay() {
      // Hide all log displays first
      document.getElementById("registrationLogDisplay").style.display = "none";
      document.getElementById("factionLogDisplay").style.display = "none";
      document.getElementById("allegiancesLogDisplay").style.display = "none";
      
      // Determine active page and show its log display
      if (document.getElementById("registrationPage").classList.contains("active")) {
        document.getElementById("registrationLogDisplay").style.display = "block";
      } else if (document.getElementById("factionPage").classList.contains("active")) {
        document.getElementById("factionLogDisplay").style.display = "block";
      } else if (document.getElementById("allegiancesPage").classList.contains("active")) {
        document.getElementById("allegiancesLogDisplay").style.display = "block";
      }
    }
    
    /**
     * Toggles the visibility of a specific log display
     * @param {string} displayId - The ID of the log display to toggle
     */
    function toggleLogDisplay(displayId) {
      const display = document.getElementById(displayId);
      if (!display) return;
      
      if (display.style.display === "none" || !display.style.display) {
        display.style.display = "block";
      } else {
        display.style.display = "none";
      }
    }
    
    /**
     * Helper function to calculate MIFARE Classic 4K addresses
     * Converts logical address to sector/block information
     * @param {number} logicalAddress - The logical address (0-255)
     * @returns {Object} - Object with sector, blockInSector, and isTrailerBlock information
     */
    function calculateMifareAddress(logicalAddress) {
      logicalAddress = parseInt(logicalAddress);
      
      // Initialize the result object
      const result = {
        sector: 0,
        blockInSector: 0,
        isTrailerBlock: false,
        absoluteBlock: logicalAddress
      };
      
      // Sectors 0-31 have 4 blocks each (small sectors)
      if (logicalAddress < 128) {
        result.sector = Math.floor(logicalAddress / 4);
        result.blockInSector = logicalAddress % 4;
        // Trailer block is the last block in each sector (block 3)
        result.isTrailerBlock = (result.blockInSector === 3);
      }
      // Sectors 32-39 have 16 blocks each (large sectors)
      else {
        const blocksInSmallSectors = 128;
        const blocksPerLargeSector = 16;
        
        const largeBlockNumber = logicalAddress - blocksInSmallSectors;
        result.sector = 32 + Math.floor(largeBlockNumber / blocksPerLargeSector);
        result.blockInSector = largeBlockNumber % blocksPerLargeSector;
        // Trailer block is the last block in each sector (block 15)
        result.isTrailerBlock = (result.blockInSector === 15);
      }
      
      return result;
    }
    
    /**
     * Validates an address for read/write operations against the memory map
     * @param {number} address - The logical address to validate (0-255)
     * @param {boolean} isWrite - Whether this is a write operation (more strict validation)
     * @returns {Object} - Validation result: {valid: boolean, reason: string, addressInfo: Object}
     */
    function validateAddress(address, isWrite = false) {
      const addressInfo = calculateMifareAddress(address);
      const result = {
        valid: true,
        reason: "",
        addressInfo: addressInfo
      };
      
      // Check for trailer blocks (don't allow writing to trailer blocks)
      if (isWrite && nfcFieldMap.protectedBlocks.trailerBlocks.has(address)) {
        result.valid = false;
        result.reason = `Cannot write to trailer block (Sector ${addressInfo.sector}, Block ${addressInfo.blockInSector})`;
        return result;
      }
      
      // Check for restricted sectors
      if (nfcFieldMap.protectedBlocks.restrictedSectors.has(addressInfo.sector)) {
        result.valid = false;
        result.reason = `Access to sector ${addressInfo.sector} is restricted`;
        return result;
      }
      
      return result;
    }
    
    /**
     * Initialize functionality to show log displays when page changes
     */
    (function() {
      // Update the original showPage function to also show the log display
      const originalShowPage = showPage;
      showPage = function(pageId) {
        originalShowPage(pageId);
        showLogDisplay();
      };
      
      // Initialize log displays on page load
      document.addEventListener('DOMContentLoaded', function() {
        // Make logs visible by default to ensure they work
        document.getElementById("registrationLogDisplay").style.display = "block";
        document.getElementById("factionLogDisplay").style.display = "none";
        document.getElementById("allegiancesLogDisplay").style.display = "none";
        
        // Add a test log entry to confirm the logging system works
        logNfcOperation("Neoband App initialized with logging system", "success");
        logNfcOperation("Use the SHOW/HIDE LOG button to toggle log visibility", "info");
      });
    })();
  </script>
