<!DOCTYPE html>
<html ufr>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neoband App</title>
  
  <!-- 
  ============================================================================
  CSS STYLES SECTION
  ============================================================================
  This section contains all the styling for the Neoband App, including:
  - Custom font definitions for the Tomorrow font family
  - Global styles for the body and common elements
  - Navigation menu styling
  - Page layout and visibility controls
  - Form input and button styling
  - Status displays and editable labels
  ============================================================================
  -->
  <style>
    /* Font definitions - Loading custom Tomorrow fonts for the futuristic UI */
    @font-face {
      font-family: 'Tomorrow';
      src: url('app/Tomorrow-Bold.ttf') format('truetype');
      font-weight: bold;
      font-style: normal;
    }
    @font-face {
      font-family: 'Tomorrow';
      src: url('app/Tomorrow-Black.ttf') format('truetype');
      font-weight: 900;
      font-style: normal;
    }
    
    /* Global Styles - Dark cyberpunk theme with cyan accent colors */
    body {
      background-color: #000000; /* Black background for the futuristic look */
      color: #0BDCF3;            /* Cyan text for high contrast and sci-fi feel */
      font-family: 'Tomorrow', sans-serif;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      box-sizing: border-box;
      position: relative;
    }
    
    /* Navigation menu styling - Horizontal menu with cyan border */
    .nav-menu {
      background-color: #000000;
      padding: 15px 0;
      border-bottom: 2px solid #0BDCF3; /* Cyan border for visual separation */
    }
    .nav-menu ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      gap: 30px;
    }
    .nav-menu a {
      color: #0BDCF3;
      text-decoration: none;
      font-size: 16px;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }
    .nav-menu a:hover {
      color: #FFFFFF; /* White on hover for better interaction feedback */
    }
    
    /* Page visibility control - Only show active page */
    .page {
      display: none;
      margin-top: 20px;
    }
    .active {
      display: block;
    }
    
    /* Form elements styling */
    .input {
      font-size: 20px;
      background-color: #FFFFFF;
      color: #000000;
      padding: 5px;
      border: none;
      text-align: center;
      margin-bottom: 10px;
      width: 100%;
      max-width: 300px;
    }
    .read-write-button {
      font-size: 20px;
      background-color: #0BDCF3; /* Cyan buttons */
      color: #000000;            /* Black text for contrast */
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      margin: 10px 5px;
    }
    .read-write-button:hover {
      background-color: #000000; /* Inverted colors on hover */
      color: #0BDCF3;
    }
    .status-display {
      background-color: #FFFFFF;
      color: #000000;
      padding: 5px;
      border: none;
      text-align: center;
      margin-top: 10px;
      width: 100%;
      max-width: 300px;
    }
    
    /* Editable label styling for faction titles and allegiances */
    .editable-label {
      font-size: 18px;
      margin-bottom: 5px;
      padding: 3px;
      border: 1px dashed #0BDCF3; /* Dashed border to indicate editability */
      display: inline-block;
      min-width: 80px;
      cursor: text;
    }
    
    /* Allegiance group container */
    .allegiance-group {
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <!-- 
  ============================================================================
  NAVIGATION MENU SECTION
  ============================================================================
  This section contains the main navigation menu that allows users to switch
  between the three main pages of the application:
  - Registration Page: For registering new users with their Neoband
  - Factions Page: For managing faction-related data
  - Allegiances Page: For managing allegiance relationships
  ============================================================================
  -->
  <nav class="nav-menu">
    <ul>
      <li><a href="#" onclick="showPage('registrationPage')">Registration</a></li>
      <li><a href="#" onclick="showPage('factionPage')">Factions</a></li>
      <li><a href="#" onclick="showPage('allegiancesPage')">Allegiances</a></li>
    </ul>
  </nav>

  <!-- 
  ============================================================================
  REGISTRATION PAGE
  ============================================================================
  This page handles the initial user registration process for Neobands.
  
  MIFARE 4K MEMORY STRUCTURE:
  - The Mifare 4K has 40 sectors (0-39) with variable block structure:
    - Sectors 0-31: 4 blocks per sector (blocks 0-3)
    - Sectors 32-39: 16 blocks per sector (blocks 0-15)
  - Each block contains exactly 16 bytes of data
  - Block 3 in sectors 0-31 and block 15 in sectors 32-39 are sector trailers
    containing access keys and conditions
  
  NEOBAND MEMORY ALLOCATION:
  - Sector 39 (blocks 0-15) is dedicated to user registration data
  - Username spans across two blocks:
    - Block 0 (address 240): First 16 bytes of username
    - Block 1 (address 241): Second 16 bytes of username
  - This allows for usernames up to 32 characters in length
  
  NFC OPERATIONS:
  - SCAN: Reads the band's unique UID using GetCardIdEx
  - READ: Retrieves the username from blocks 240-241 (Sector 39, Blocks 0-1)
    using LinearRead with Key A (0x60), key index 0
  - WRITE: Writes the username across blocks 240-241 (Sector 39, Blocks 0-1)
    using LinearWrite with Key A (0x60), key index 0
  - RESET: Clears the username data by writing empty values to blocks 240-241
  
  KEY MANAGEMENT:
  - Sector 39 uses authentication key at index 0 (default)
  - Authentication mode is always KEY A (0x60)
  - Block operations always read/write exactly 16 bytes (cannot write partial blocks)
  
  LOGGING FEATURES:
  - Console logs track all NFC operations with timestamps
  - Visual log display shows authentication, read/write operations
  - Detailed error handling with human-readable messages
  ============================================================================
  -->
  <div id="registrationPage" class="page active">
    <h2>User Registration</h2>
    <div>
      <label>New Username:</label><br>
      <input id="usernameInput" class="input" type="text" maxlength="32" placeholder="Enter new username (up to 32 characters)">
    </div>
    <div>
      <label>Band ID:</label><br>
      <input id="bandIdInput" class="input" type="text" readonly placeholder="Waiting for band...">
    </div>
    <div>
      <label>Status:</label><br>
      <input id="statusInput" class="status-display" type="text" readonly placeholder="Unregistered" value="Unregistered">
    </div>
    <div style="margin-top:20px;">
      <button class="read-write-button" onclick="handleScanTag()">SCAN</button>
      <button class="read-write-button" onclick="handleReadRegistration()">READ</button>
      <button class="read-write-button" onclick="handleWriteRegistration()">WRITE</button>
      <button class="read-write-button" onclick="handleResetRegistration()">RESET</button>
    </div>
  </div>

  <!-- 
  ============================================================================
  FACTION PAGE
  ============================================================================
  This page manages faction-related data for a registered user:
  - Displays the username from the scanned band
  - Allows setting Hunter/Bounty status
  - Tracks number of wins
  - Records best draw time
  - Allows editing faction title
  
  NFC Operations (for Alleycat Faction in Sector 1):
  - READ: Primarily uses SectorRead to access Sector 1 directly:
          Username from address 240 (Sector 39, Block 0),
          Hunter/Bounty from Sector 1, Block 0 (address 4),
          Wins from Sector 1, Block 1 (address 5),
          Draw Time from Sector 1, Block 2 (address 6)
          With linear read fallback if sector-based read fails.
  - WRITE: Primarily uses SectorWrite to access Sector 1 directly:
           Hunter/Bounty to Sector 1, Block 0 (address 4),
           Wins to Sector 1, Block 1 (address 5),
           Draw Time to Sector 1, Block 2 (address 6)
           With linear write fallback if sector-based write fails.
  ============================================================================
  -->
  <div id="factionPage" class="page">
    <h2>Factions</h2>
    <div>
      <label>Faction Username:</label><br>
      <input id="factionUsernameField" class="input" type="text" readonly placeholder="Waiting for scan...">
    </div>
    <div>
      <label>Hunter/Bounty:</label><br>
      <input id="hunterBountyInput" class="input" type="text" placeholder="Enter Hunter/Bounty">
    </div>
    <div>
      <label># of Wins:</label><br>
      <input id="winsInput" class="input" type="text" placeholder="Enter # of wins">
    </div>
    <div>
      <label>Best Draw Time:</label><br>
      <input id="drawTimeInput" class="input" type="text" placeholder="Enter Best Draw Time">
    </div>
    <div>
      <label>Faction Title:</label><br>
      <div id="factionTitle" class="editable-label" contenteditable="true">ALLEYCAT</div>
    </div>
    <div style="margin-top:20px;">
      <button class="read-write-button" onclick="handleReadFaction()">READ</button>
      <button class="read-write-button" onclick="handleWriteFaction()">WRITE</button>
    </div>
  </div>

  <!-- 
  ============================================================================
  ALLEGIANCES PAGE
  ============================================================================
  This page manages allegiance relationships for a registered user:
  - Displays the username from the scanned band
  - Provides 16 editable allegiance fields
  - Each allegiance has an editable label and input field
  
  NFC Operations:
  - READ: Retrieves allegiance data from address 4 (username) and addresses
          12-32 (16 allegiance fields)
  - WRITE: Writes allegiance data to addresses 4 and 12-32
  
  Note: The 16 allegiance fields are dynamically generated in JavaScript
  ============================================================================
  -->
  <div id="allegiancesPage" class="page">
    <h2>Allegiances</h2>
    <div>
      <label>Allegiances Username:</label><br>
      <input id="allegiancesUsernameField" class="input" type="text" readonly placeholder="Waiting for scan...">
    </div>
    <!-- Container for 16 dynamically generated allegiance fields -->
    <div id="allegiancesContainer">
      <!-- We will create 16 groups dynamically in JavaScript -->
    </div>
    <div style="margin-top:20px;">
      <button class="read-write-button" onclick="handleReadAllegiances()">READ</button>
      <button class="read-write-button" onclick="handleWriteAllegiances()">WRITE</button>
    </div>
  </div>

  <!-- 
  ============================================================================
  JAVASCRIPT SECTION
  ============================================================================
  This section contains all the JavaScript functionality for the Neoband App,
  organized into logical sections:
  
  1. Utility Functions:
     - Navigation and page management
     - Sleep function for timing operations
     - Text-to-hex and hex-to-text conversion
     - Padding functions for NFC data
  
  2. NFC Communication Functions:
     - Generic read/write functions for NFC operations
     - Address-specific read/write operations
  
  3. Page-Specific Functions:
     - Registration page handlers
     - Faction page handlers
     - Allegiances page handlers
  ============================================================================
  -->
  <script>
    //==========================================================================
    // UTILITY FUNCTIONS
    //==========================================================================
    
    /**
     * Shows the selected page and hides all others
     * @param {string} pageId - The ID of the page to display
     */
    function showPage(pageId) {
      // Hide all pages
      var pages = document.getElementsByClassName("page");
      for (var i = 0; i < pages.length; i++) {
        pages[i].classList.remove("active");
      }
      // Show the selected page
      document.getElementById(pageId).classList.add("active");
      // If Allegiances page, build fields if not built
      if(pageId === "allegiancesPage") {
        buildAllegiancesFields();
      }
    }

    /**
     * UTILITIES FOR MIFARE MEMORY OPERATIONS
     * ======================================
     */
    
    /**
     * Converts hexadecimal string to readable text
     * 
     * @param {string} hex - Hexadecimal string to convert
     * @returns {string} - ASCII text representation
     * 
     * OPERATION DETAILS:
     * - Takes a string of hex bytes (e.g., "48656C6C6F")
     * - Converts each hex pair to its ASCII character equivalent
     * - Stops at the first "FF" padding character
     * - Handles both upper and lowercase hex input
     * - Returns an empty string for invalid hex input
     */
    function hexToText(hex) {
      var result = "";
      // Remove "0x" prefix if present
      if (hex.startsWith("0x") || hex.startsWith("0X")) {
        hex = hex.substring(2);
      }
      // Process each byte (2 hex chars)
      for (var i = 0; i < hex.length; i += 2) {
        if (i + 1 >= hex.length) break; // Incomplete byte
        var byteStr = hex.substring(i, i + 2);
        // Stop at the first FF padding
        if (byteStr.toUpperCase() === "FF") break;
        var byte = parseInt(byteStr, 16);
        if (!isNaN(byte)) {
          result += String.fromCharCode(byte);
        }
      }
      return result;
    }

    /**
     * Converts text to hexadecimal string
     * 
     * @param {string} text - Text to convert to hex
     * @returns {string} - Hexadecimal representation
     * 
     * OPERATION DETAILS:
     * - Converts each character to its 2-digit hex representation
     * - Returns uppercase hex for consistency (e.g., "48656C6C6F" for "Hello")
     * - Returns an empty string for empty input
     * - Handles all ASCII characters including special characters
     * - No padding is added (use padHex separately if needed)
     */
    function textToHex(text) {
      var result = "";
      for (var i = 0; i < text.length; i++) {
        var hex = text.charCodeAt(i).toString(16).toUpperCase();
        // Pad single digit hex values with leading zero
        result += hex.padStart(2, '0');
      }
      return result;
    }

    /**
     * Pads a hexadecimal string with FF bytes to the specified length
     * 
     * @param {string} hex - Hexadecimal string to pad
     * @param {number} length - Target length in characters (must be even)
     * @returns {string} - Padded hexadecimal string
     * 
     * OPERATION DETAILS:
     * - Used to ensure the exact block size for MIFARE writes (16 bytes = 32 hex chars)
     * - Appends "FF" padding bytes until the specified length is reached
     * - Makes no changes if the input is already at or exceeding the target length
     * - Essential for MIFARE memory operations where exact block size is required
     */
    function padHex(hex, length) {
      while (hex.length < length) {
        hex += "FF"; // Standard MIFARE padding
      }
      return hex;
    }

    /**
     * Adds a delay to ensure NFC operations don't overlap
     * 
     * @param {number} ms - Milliseconds to delay
     * @returns {Promise} - Resolves after the specified delay
     * 
     * OPERATION DETAILS:
     * - Creates a promise that resolves after the specified timeout
     * - Used to prevent NFC reader conflicts when operations occur too quickly
     * - Important for sequential read/write operations to complete reliably
     * - Typical use: await sleep(500) between NFC operations
     */
    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    //==========================================================================
    // NFC COMMUNICATION FUNCTIONS
    //==========================================================================
    
    /**
     * Read data from a specific address (block) on the NFC tag
     * 
     * @param {string} address - The linear block address to read from (0-255)
     * @returns {Promise<string>} - The data read from the block as a string
     * @throws {Error} - If reading fails due to authentication or communication issues
     * 
     * TECHNICAL DETAILS:
     * - Performs KEY A authentication with key index 0 before reading
     * - Uses "LinearRead" action for MIFARE Classic compatibility
     * - Logs authentication key and mode for debugging
     * - Records sector and block information derived from address
     * - Logs both raw and interpreted data
     * - Handles authentication failures with detailed error messages
     * - Provides hex representation of the data for debugging
     * 
     * AUTHENTICATION FLOW:
     * 1. Attempts LinearRead with KEY A auth
     * 2. Records timestamp, block address, and authentication details
     * 3. Processes data to convert from binary to string format
     * 4. Strips trailing FF padding (hex FF)
     * 5. Returns a clean string representation of the data
     * 
     * ERROR HANDLING:
     * - Comprehensive error handling with fallback mechanisms
     * - Provides descriptive error messages with block addresses
     * - Logs all operations with timestamps and status
     * 
     * USAGE CONTEXTS:
     * - Registration Page: Reads username from blocks 240-241 (Sector 39, Blocks 0-1)
     * - Faction Page: Reads username from blocks 240-241 and faction data from blocks 4-6
     * - Allegiances Page: Reads username from blocks 240-241 and allegiance data from blocks 192-207
     */
    function readField(address) {
      return new Promise((resolve, reject) => {
        console.log(`[READ] Attempting to read from address ${address} with KEY A (0x60) authentication`);
        
        // Calculate sector and block numbers for logging
        let sector, blockInSector;
        if (parseInt(address) < 128) {
          sector = Math.floor(parseInt(address) / 4);
          blockInSector = parseInt(address) % 4;
        } else {
          sector = Math.floor((parseInt(address) - 128) / 16) + 32;
          blockInSector = (parseInt(address) - 128) % 16;
        }
        console.log(`[READ] Translates to Sector ${sector}, Block ${blockInSector}`);
        
        const timestamp = new Date().toISOString();
        console.log(`[READ ${timestamp}] Using auth KEY A (index 0) for block ${address}`);
        
        ufRequest("LinearRead", { 
          "address": address, 
          "auth": "0", // KEY A authentication with key index 0
          "len": "16"  // Each block is 16 bytes
        }, function() {
          var output = ufResponse();
          if (output) {
            console.log(`[READ] Authentication result: ${output.Status}`);
            
            if (output.Status === "[0x00 (0)] UFR_OK") {
              var blockData = output.Data || "";
              console.log(`[READ SUCCESS] Raw data from block ${address}: ${blockData}`);
              
              // Convert data to hex for logging
              let hexData = '';
              for (let i = 0; i < blockData.length; i += 2) {
                if (blockData.substr(i, 2) !== 'FF') {
                  hexData += blockData.substr(i, 2) + ' ';
                }
              }
              console.log(`[READ SUCCESS] Data in hex (excluding FF padding): ${hexData.trim()}`);
              
              // Convert hex data to string
              var result = "";
              for (var i = 0; i < blockData.length; i += 2) {
                var hex = blockData.substr(i, 2);
                if (hex === "FF") break; // Stop at the first FF (padding)
                var decimal = parseInt(hex, 16);
                result += String.fromCharCode(decimal);
              }
              
              console.log(`[READ SUCCESS] Data as string: "${result}"`);
              resolve(result);
            } else {
              console.error(`[READ ERROR] Failed to read from block ${address}: ${output.Status}`);
              reject(`Failed to read registration data. Status: ${output.Status}`);
            }
          } else {
            console.error(`[READ ERROR] Unknown error reading from block ${address}`);
            reject("Unknown error reading registration data.");
          }
        });
      });
    }

    /**
     * Write data to a specific address (block) on the NFC tag
     * 
     * @param {string} address - The linear block address to write to (0-255)
     * @param {string} data - The data to write to the block (max 16 chars)
     * @returns {Promise<void>} - Resolves when write is successful
     * @throws {Error} - If writing fails due to authentication or communication issues
     * 
     * TECHNICAL DETAILS:
     * - Performs KEY A authentication with key index 0 before writing
     * - Uses "LinearWrite" action for MIFARE Classic compatibility
     * - Automatically pads data to 16 bytes with FF
     * - Logs authentication key and mode for debugging
     * - Records sector and block information derived from address
     * - Provides detailed operation logging with timestamps
     * - Shows both string and hex representations of data
     * 
     * DATA HANDLING:
     * - Truncates data if longer than 16 characters
     * - Converts string data to hex format for MIFARE storage
     * - Automatically pads with FF to fill the entire 16-byte block
     * - Handles empty strings by writing a block of FF padding
     * 
     * AUTHENTICATION FLOW:
     * 1. Converts string data to hex format
     * 2. Pads with FF up to 16 bytes
     * 3. Attempts LinearWrite with KEY A auth
     * 4. Records timestamp, block address, and authentication details
     * 5. Verifies successful write operation
     * 
     * ERROR HANDLING:
     * - Comprehensive error handling with detailed logs
     * - Provides descriptive error messages with block addresses
     * - Logs all operations with timestamps and status
     */
    function writeField(address, data) {
      return new Promise((resolve, reject) => {
        console.log(`[WRITE] Attempting to write to address ${address} with KEY A (0x60) authentication`);
        
        // Calculate sector and block numbers for logging
        let sector, blockInSector;
        if (parseInt(address) < 128) {
          sector = Math.floor(parseInt(address) / 4);
          blockInSector = parseInt(address) % 4;
        } else {
          sector = Math.floor((parseInt(address) - 128) / 16) + 32;
          blockInSector = (parseInt(address) - 128) % 16;
        }
        console.log(`[WRITE] Translates to Sector ${sector}, Block ${blockInSector}`);
        
        // Truncate data if needed (each block can only store 16 bytes)
        if (data.length > 16) {
          console.warn(`[WRITE WARNING] Data too long (${data.length} chars), truncating to 16 chars`);
          data = data.substring(0, 16);
        }
        
        // Convert string to hex
        var hexData = "";
        for (var i = 0; i < data.length; i++) {
          var hex = data.charCodeAt(i).toString(16).toUpperCase();
          hexData += hex.padStart(2, '0');
        }
        
        // Pad with FF to fill the block (16 bytes = 32 hex chars)
        while (hexData.length < 32) {
          hexData += "FF";
        }
        
        const timestamp = new Date().toISOString();
        console.log(`[WRITE ${timestamp}] Using auth KEY A (index 0) for block ${address}`);
        console.log(`[WRITE] Writing data: "${data}" (Hex: ${hexData})`);
        
        ufRequest("LinearWrite", { 
          "address": address, 
          "auth": "0", // KEY A authentication with key index 0
          "data": hexData
        }, function() {
          var output = ufResponse();
          if (output) {
            console.log(`[WRITE] Authentication result: ${output.Status}`);
            
            if (output.Status === "[0x00 (0)] UFR_OK") {
              console.log(`[WRITE SUCCESS] Successfully wrote to block ${address}`);
              resolve();
            } else {
              console.error(`[WRITE ERROR] Failed to write to block ${address}: ${output.Status}`);
              reject(`Failed to write data. Status: ${output.Status}`);
            }
          } else {
            console.error(`[WRITE ERROR] Unknown error writing to block ${address}`);
            reject("Unknown error writing data.");
          }
        });
      });
    }

    //==========================================================================
    // REGISTRATION PAGE FUNCTIONS
    //==========================================================================
    
    /**
     * MIFARE MEMORY LAYOUT DOCUMENTATION
     * ==================================
     * 
     * MIFARE CLASSIC 4K STRUCTURE:
     * - Total Memory: 4096 bytes (4K)
     * - Block Size: 16 bytes per block
     * - Total Blocks: 256 blocks (numbered 0-255)
     * - Sector Organization:
     *   - Sectors 0-31: 4 blocks per sector (Blocks 0-127)
     *   - Sectors 32-39: 16 blocks per sector (Blocks 128-255)
     * 
     * ADDRESSING SCHEMES:
     * - Linear Addressing: Block numbers 0-255 used in most functions
     * - Sector/Block Addressing: (Sector X, Block Y) - Used for reference
     *   - Conversion: Linear Block = (Sector * 4) + Block (for sectors 0-31)
     *   - For sectors 32-39: Linear Block = 128 + ((Sector-32) * 16) + Block
     * 
     * NEOBAND MEMORY ALLOCATION:
     * - Registration Data (Username): Sector 39, Blocks 0-1 (Linear Blocks 240-241)
     *   - Block 240: First 16 chars of username
     *   - Block 241: Last 16 chars of username (if needed)
     * 
     * AUTHENTICATION:
     * - All operations use KEY A authentication (0x60)
     * - Key Index 0 is used for all read/write operations
     * - Standard MIFARE access conditions applied
     * 
     * BLOCK FORMAT:
     * - Each block stores exactly 16 bytes
     * - Unused space is padded with 0xFF
     * - String data is ASCII/UTF-8 encoded
     * - No special header/footer is used
     * 
     * DATA HANDLING:
     * - Username limited to 32 characters (spans 2 blocks)
     * - Data is read/written as raw strings
     * - Empty fields are written as empty strings (filled with 0xFF padding)
     */

    /**
     * Scans an NFC tag to get its UID
     * Updates the Band ID field and status display
     * 
     * OPERATION DETAILS:
     * - Uses ufRequest("GetCardIdEx") to communicate with the uFR reader
     * - Extracts UID from the response when successful
     * - Updates three UI elements with the detected UID:
     *   1. bandIdInput - Shows UID in registration page
     *   2. factionUsernameField - Populates faction page with same UID
     *   3. allegiancesUsernameField - Populates allegiances page with same UID
     * - Sets status to "Connected" when successful
     * - Sets status to "Error" and displays alert on failure
     * 
     * ERROR HANDLING:
     * - Logs detailed error information to console
     * - Displays user-friendly error messages via alerts
     * - Preserves error state in status display
     */
    async function handleScanTag() {
      try {
        console.log("[SCAN] Attempting to scan NFC tag...");
        ufRequest("GetCardIdEx", function() {
          var output = ufResponse();
          if (output && output.Status === "[0x00 (0)] UFR_OK") {
            var uid = output.CardUid || "Unknown UID";
            console.log(`[SCAN SUCCESS] Card detected with UID: ${uid}`);
            
            // Update Band ID field
            document.getElementById("bandIdInput").value = uid;
            document.getElementById("statusInput").value = "Connected";
            
            // Update username fields on Faction and Allegiances pages
            document.getElementById("factionUsernameField").value = uid;
            document.getElementById("allegiancesUsernameField").value = uid;
          } else {
            console.error(`[SCAN ERROR] Failed to scan tag: ${output ? output.Status : "Unknown error"}`);

     * - Updates the UI with the retrieved username
     * - Sets status to "Read OK" when successful

     * - Logs both success and failure of each block read operation
     * - Provides color-coded visual feedback in the log display
     * - Sets status to "Read Error" if the primary block read fails
     * - Displays technical details in console and user-friendly summary in UI
     *

    /**
     * Writes the username to the NFC tag (addresses 240-241 - Sector 39, Blocks 0-1)
     * Validates input before writing
     * 
     * OPERATION DETAILS:
     * - Creates/updates a visual log display in the registration page
     * - Performs validation checks:
     *   1. Verifies a band has been scanned
     *   2. Ensures username is not empty
     *   3. Confirms username is 32 characters or less
     * - Splits username into two parts if longer than 16 chars:
     *   - First 16 chars → Block 240 (Sector 39, Block 0)
     *   - Remaining chars → Block 241 (Sector 39, Block 1)
     * - If username is 16 chars or less, writes to Block 240 and clears Block 241
     * - Uses KEY A (0x60) authentication with key index 0
     * - Sets status to "Registered" when successful
     * 
     * MEMORY HANDLING:
     * - Each block write is exactly 16 bytes
     * - Shorter data is padded with FF
     * - Always clears Block 241 if not needed to avoid data remnants
     * - Ensures proper null-termination and memory clearing
     * 
     * ERROR HANDLING:
     * - Provides detailed validation feedback before attempting writes
     * - Logs both success and failure of each block write operation
     * - Color-coded visual feedback in the log display
     * - Sets status to "Write Error" if any write operation fails
     * 
     * MIFARE MEMORY ADDRESSED:
     * - Primary block: Address 240 (Sector 39, Block 0)
     * - Secondary block: Address 241 (Sector 39, Block 1)
     */
    async function handleWriteRegistration() {
      try {
        console.log("[USERNAME WRITE] Starting username write operation");
        var username = document.getElementById("usernameInput").value.trim();
        
        // Create a log display element if it doesn't exist
        let logDisplay = document.getElementById("registrationLogDisplay");
        if (!logDisplay) {
          logDisplay = document.createElement("div");
          logDisplay.id = "registrationLogDisplay";
          logDisplay.style.maxHeight = "150px";
          logDisplay.style.overflow = "auto";
          logDisplay.style.fontFamily = "monospace";
          logDisplay.style.fontSize = "12px";
          logDisplay.style.marginTop = "15px";
          logDisplay.style.padding = "10px";
          logDisplay.style.backgroundColor = "#000022";
          logDisplay.style.border = "1px solid #0BDCF3";
          document.getElementById("registrationPage").appendChild(logDisplay);
        }
        
        // Clear previous logs
        logDisplay.innerHTML = "<div style='color:#0BDCF3;'>--- OPERATION LOGS ---</div>";
        
        // Validate inputs
        if (!document.getElementById("bandIdInput").value.trim()) {
          logDisplay.innerHTML += "<div style='color:#FF0000;'>✗ No band detected. Please scan a band first.</div>";
          alert("Please scan a band first.");
          return;
        }
        if (!username) {
          logDisplay.innerHTML += "<div style='color:#FF0000;'>✗ Username field is empty. Please enter a username.</div>";
          alert("Please enter a username.");
          return;
        }
        if (username.length > 32) {
          logDisplay.innerHTML += `<div style='color:#FF0000;'>✗ Username too long (${username.length}/32 chars). Must be 32 characters or less.</div>`;
          alert("Username must be 32 characters or less.");
          return;
        }
        
        logDisplay.innerHTML += `<div style='color:#FFFFFF;'>Validating username: "${username}" (${username.length}/32 chars)</div>`;
        
        // Split username into two parts if needed (16 bytes each)
        let firstHalf = username;
        let secondHalf = "";
        
        if (username.length > 16) {
          firstHalf = username.substring(0, 16);
          secondHalf = username.substring(16);
          logDisplay.innerHTML += `<div style='color:#FFFFFF;'>Username split into two parts: "${firstHalf}" + "${secondHalf}"</div>`;
        } else {
          logDisplay.innerHTML += "<div style='color:#FFFFFF;'>Username fits in single block</div>";
        }
        
        // Write first half of username to address 240 (Sector 39, Block 0)
        logDisplay.innerHTML += "<div style='color:#FFFFFF;'>Writing to Block 240 (Sector 39, Block 0)...</div>";
        await writeField("240", firstHalf);
        logDisplay.innerHTML += `<div style='color:#00FF00;'>✓ Successfully wrote to Block 240: "${firstHalf}"</div>`;
        
        // Write second half of username to address 241 (Sector 39, Block 1) if needed
        if (secondHalf) {
          logDisplay.innerHTML += "<div style='color:#FFFFFF;'>Writing to Block 241 (Sector 39, Block 1)...</div>";
          await writeField("241", secondHalf);
          logDisplay.innerHTML += `<div style='color:#00FF00;'>✓ Successfully wrote to Block 241: "${secondHalf}"</div>`;
        } else {
          // Clear the second block if shorter username
          logDisplay.innerHTML += "<div style='color:#FFFFFF;'>Clearing Block 241 (Sector 39, Block 1)...</div>";
          await writeField("241", "");
          logDisplay.innerHTML += "<div style='color:#00FF00;'>✓ Successfully cleared Block 241</div>";
        }
        
        document.getElementById("statusInput").value = "Registered";
        logDisplay.innerHTML += "<div style='color:#00FF00;'>✓ Registration completed successfully!</div>";
        console.log(`[USERNAME WRITE] Username "${username}" written successfully to blocks 240-241`);
        alert("Registration successful!");
      } catch (error) {
        console.error("[USERNAME WRITE ERROR]", error);
        document.getElementById("statusInput").value = "Write Error";
        
        // Update log display with error
        let logDisplay = document.getElementById("registrationLogDisplay");
        if (logDisplay) {
          logDisplay.innerHTML += `<div style='color:#FF0000;'>✗ ERROR: ${error}</div>`;
        }
        
        alert(error);
      }
    }

    /**
     * Dynamically builds the 16 allegiance fields
     * Creates editable labels and input fields for each allegiance
     */
    function buildAllegiancesFields() {
      var container = document.getElementById("allegiancesContainer");
      // Only build if not already built
      if (container.childElementCount > 0) return;
      
      // Create 16 allegiance field groups
      for (var i = 1; i <= 16; i++) {
        // Create a group div
        var group = document.createElement("div");
        group.className = "allegiance-group";
        
        // Create an editable label
        var label = document.createElement("div");
        label.className = "editable-label";
        label.contentEditable = "true";
        label.id = "allegianceLabel" + i;
        
        // Set default label text based on known allegiance names from CSV
        if (i <= 16) {
          if (i <= 8) {
            label.innerText = "ENDLINE " + i;
          } else if (i <= 12) {
            label.innerText = "HELIX " + (i-8);
          } else {
            label.innerText = "RESISTANCE " + (i-12);
          }
        } else {
          label.innerText = "TEXT " + i;
        }
        
        // Create an input field
        var input = document.createElement("input");
        input.type = "text";
        input.className = "input";
        input.placeholder = "Enter text";
        
        // Set an ID for the input
        input.id = "allegiance" + i;
        
        // Append label and input to the group
        group.appendChild(label);
        group.appendChild(document.createElement("br"));
        group.appendChild(input);
        
        // Append the group to the container
        container.appendChild(group);
      }
    }

     * - Maintains compatibility with older cards that may only use Block 240
     *

        statusElement.textContent = "Writing allegiance data...";
        
        // Loop through each allegiance field
        let successCount = 0;
        for (var i = 1; i <= 16; i++) {
          var address = allegianceAddresses[i];
          var text = document.getElementById("allegiance" + i).value.trim();
          
          try {
            await writeField(address, text);
            successCount++;
          } catch (fieldError) {
            console.error(`Error writing allegiance field ${i}:`, fieldError);
            // Continue with other fields even if one fails
          }
        }
        
        if (successCount === 16) {
          statusElement.textContent = "All allegiance data written successfully!";
          statusElement.style.color = "#00FF00"; // Green for success
          setTimeout(() => {
            alert("All allegiance data written successfully!");
          }, 100);
        } else if (successCount > 0) {
          statusElement.textContent = `Successfully wrote ${successCount} out of 16 allegiance fields. Some fields may have failed.`;
          statusElement.style.color = "#FFA500"; // Orange for partial success
          setTimeout(() => {
            alert(`Successfully wrote ${successCount} out of 16 allegiance fields. Some fields may have failed.`);
          }, 100);
        } else {
          statusElement.textContent = "Failed to write any allegiance data. Please check the card and try again.";
          statusElement.style.color = "#FF0000"; // Red for error
        }
      } catch (error) {
        console.error("Allegiances operation error:", error);
        alert("An unexpected error occurred. Please try again.");
      }
    }
  </script>

</body>
</html>
